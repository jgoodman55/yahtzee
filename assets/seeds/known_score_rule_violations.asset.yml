name: known_score_rule_violations
type: duckdb.seed
description: |
  Photo-review leftovers that still violate raw_games score rules.
  Empty after Jordan's review (g39 erin ones=6 cleared). The audit
  hard-fails when violation_count != 0. Re-add a row here only if a
  leftover must be temporarily allowlisted again.
parameters:
  path: known_score_rule_violations.csv
columns:
  - name: game_seq
    type: integer
    checks:
      - name: not_null
  - name: player
    type: string
    checks:
      - name: not_null
  - name: category
    type: string
    checks:
      - name: not_null
  - name: score
    type: integer
    checks:
      - name: not_null
  - name: rule
    type: string
    checks:
      - name: not_null
