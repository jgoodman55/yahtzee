name: known_score_rule_violations
type: duckdb.seed
description: |
  Photo-review leftovers that still violate raw_games score rules.
  Currently empty. The audit hard-fails on any violation that is not
  listed here. Add a row when a leftover must stay as written.
parameters:
  path: known_score_rule_violations.csv
columns:
  - name: game_seq
    type: integer
    checks:
      - name: not_null
  - name: player
    type: string
    checks:
      - name: not_null
  - name: category
    type: string
    checks:
      - name: not_null
  - name: score
    type: integer
    checks:
      - name: not_null
  - name: rule
    type: string
    checks:
      - name: not_null
