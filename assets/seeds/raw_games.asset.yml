name: raw_games
type: duckdb.seed
parameters:
  path: raw_games.csv
columns:
  - name: game_seq
    type: integer
    checks:
      - name: not_null
  - name: player
    type: string
    checks:
      - name: not_null
  - name: category
    type: string
    checks:
      - name: not_null
      - name: accepted_values
        value:
          - ones
          - twos
          - threes
          - fours
          - fives
          - sixes
          - upper_bonus
          - three_of_a_kind
          - four_of_a_kind
          - full_house
          - small_straight
          - large_straight
          - yahtzee
          - chance
          - yahtzee_bonus
  - name: score
    type: integer
    checks:
      - name: not_null
