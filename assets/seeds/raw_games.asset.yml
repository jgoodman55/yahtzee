name: raw_games
type: duckdb.seed
parameters:
  path: raw_games.csv
# Fixed-box / upper-face rules that currently have zero leftover violators
# after Jordan's photo-review. Remaining impossible scores (yahtzee, chance
# 0, some upper faces) are listed by raw_games_score_rules instead of
# failing this seed — see known_score_rule_violations.csv.
custom_checks:
  - name: full_house_is_0_or_25
    query: |
      select count(*) from raw_games
      where lower(trim(category)) = 'full_house'
        and cast(score as integer) not in (0, 25)
    value: 0
  - name: small_straight_is_0_or_30
    query: |
      select count(*) from raw_games
      where lower(trim(category)) = 'small_straight'
        and cast(score as integer) not in (0, 30)
    value: 0
  - name: large_straight_is_0_or_40
    query: |
      select count(*) from raw_games
      where lower(trim(category)) = 'large_straight'
        and cast(score as integer) not in (0, 40)
    value: 0
  - name: upper_bonus_is_0_or_35
    query: |
      select count(*) from raw_games
      where lower(trim(category)) = 'upper_bonus'
        and cast(score as integer) not in (0, 35)
    value: 0
  - name: twos_multiple_of_2_in_0_to_10
    query: |
      select count(*) from raw_games
      where lower(trim(category)) = 'twos'
        and (cast(score as integer) % 2 <> 0
             or cast(score as integer) < 0
             or cast(score as integer) > 10)
    value: 0
  - name: threes_multiple_of_3_in_0_to_15
    query: |
      select count(*) from raw_games
      where lower(trim(category)) = 'threes'
        and (cast(score as integer) % 3 <> 0
             or cast(score as integer) < 0
             or cast(score as integer) > 15)
    value: 0
columns:
  - name: game_seq
    type: integer
    checks:
      - name: not_null
  - name: player
    type: string
    checks:
      - name: not_null
  - name: category
    type: string
    checks:
      - name: not_null
      - name: accepted_values
        value:
          - ones
          - twos
          - threes
          - fours
          - fives
          - sixes
          - upper_bonus
          - three_of_a_kind
          - four_of_a_kind
          - full_house
          - small_straight
          - large_straight
          - yahtzee
          - chance
          - yahtzee_bonus
  - name: score
    type: integer
    checks:
      - name: not_null
  - name: recorded_total
    type: integer
    checks:
      - name: not_null
