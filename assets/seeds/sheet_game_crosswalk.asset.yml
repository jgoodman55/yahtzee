name: sheet_game_crosswalk
type: duckdb.seed
parameters:
  path: sheet_game_crosswalk.csv
columns:
  - name: game_seq
    type: integer
    checks:
      - name: not_null
      - name: unique
  - name: sheet
    type: string
    checks:
      - name: not_null
  - name: game_on_sheet
    type: integer
    checks:
      - name: not_null
