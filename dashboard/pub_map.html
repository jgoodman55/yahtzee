<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yahtzee pub map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <style>
    :root {
      --ink: #1b2430;
      --muted: #5c6b7a;
      --paper: #f7f4ee;
      --panel: rgba(255, 255, 255, 0.94);
      --line: #d9d0c3;
      --amber: #d97706;
      --amber-deep: #b45309;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    #map { position: absolute; inset: 0; }
    .chrome {
      position: absolute;
      z-index: 500;
      top: 12px;
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: min(340px, calc(100vw - 24px));
      pointer-events: none;
    }
    .chrome > * { pointer-events: auto; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(27, 36, 48, 0.12);
      backdrop-filter: blur(10px);
    }
    header.card { padding: 14px 16px 12px; }
    header h1 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }
    .basemap-note {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .list {
      padding: 8px;
      max-height: min(42vh, 360px);
      overflow: auto;
    }
    .list h2 {
      margin: 4px 8px 8px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .pub-btn {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .pub-btn:hover, .pub-btn:focus-visible { background: #f3ebe0; outline: none; }
    .pub-btn .name { font-weight: 600; }
    .pub-btn .meta { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
    .legend {
      position: absolute;
      z-index: 500;
      right: 12px;
      bottom: 24px;
      padding: 10px 12px;
      font-size: 0.78rem;
    }
    .legend strong { display: block; margin-bottom: 6px; }
    .swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }
    .dot {
      border: 2px solid #fff;
      background: var(--amber);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(180, 83, 9, 0.35);
    }
    .leaflet-popup-content { margin: 10px 12px; }
    .popup-title { font-weight: 700; margin: 0 0 4px; }
    .popup-meta { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .empty {
      padding: 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Interactive pub map"></div>
  <div class="chrome">
    <header class="card">
      <h1>Yahtzee pub map</h1>
      <p>Confirmed venues from <code>mart_pub_locations</code> only — not joined to games. Bubbles scale by visit count.</p>
      <p class="basemap-note">Leaflet + OpenStreetMap tiles (no API key). This is the closest practical stand-in for Apple Maps; DAC 0.15 cannot embed MapKit or Leaflet.</p>
    </header>
    <section class="card list" id="pub-list" hidden>
      <h2>Venues</h2>
      <div id="pub-list-items"></div>
    </section>
  </div>
  <div class="card legend" id="legend" hidden>
    <strong>Visits</strong>
    <div id="legend-swatches"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="pub_map/pubs.js"></script>
  <script>
    (function () {
      var LONDON = [51.5074, -0.1278];
      var MIN_RADIUS = 10;
      var MAX_RADIUS = 30;

      function collection() {
        if (window.PUB_MAP_DATA && window.PUB_MAP_DATA.features) {
          return window.PUB_MAP_DATA;
        }
        return { type: "FeatureCollection", features: [] };
      }

      function visitsOf(feature) {
        return Number(feature.properties && feature.properties.visit_count) || 1;
      }

      function radiusFor(visits, maxVisits) {
        if (!maxVisits || maxVisits <= 1) {
          return 16;
        }
        var t = Math.sqrt(visits / maxVisits);
        return MIN_RADIUS + t * (MAX_RADIUS - MIN_RADIUS);
      }

      function tileLayer() {
        // Default: free OSM raster tiles, no signup / no secrets.
        // Optional nicer tiles: append ?maptiler=YOUR_KEY to the URL.
        var params = new URLSearchParams(window.location.search);
        var maptiler = params.get("maptiler") || params.get("MAPTILER_KEY");
        if (maptiler) {
          return L.tileLayer(
            "https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=" + encodeURIComponent(maptiler),
            {
              attribution: '&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
              maxZoom: 19
            }
          );
        }
        return L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          maxZoom: 19
        });
      }

      var data = collection();
      var features = data.features || [];
      var maxVisits = features.reduce(function (max, f) {
        return Math.max(max, visitsOf(f));
      }, 1);

      var map = L.map("map", {
        center: LONDON,
        zoom: 12,
        zoomControl: true
      });
      tileLayer().addTo(map);

      var markers = [];
      var bounds = [];

      features.forEach(function (feature, index) {
        var coords = feature.geometry && feature.geometry.coordinates;
        if (!coords) return;
        var lng = coords[0];
        var lat = coords[1];
        var props = feature.properties || {};
        var visits = visitsOf(feature);
        var marker = L.circleMarker([lat, lng], {
          radius: radiusFor(visits, maxVisits),
          color: "#fff",
          weight: 2,
          fillColor: "#d97706",
          fillOpacity: 0.82
        });
        var visitLabel = visits === 1 ? "1 visit" : visits + " visits";
        marker.bindPopup(
          '<p class="popup-title"></p><p class="popup-meta"></p>'.replace(
            'class="popup-title"></p>',
            'class="popup-title">' + escapeHtml(props.name || "Pub") + "</p>"
          ).replace(
            'class="popup-meta"></p>',
            'class="popup-meta">' + visitLabel +
              (props.source ? " · " + escapeHtml(String(props.source)) : "") +
              "</p>"
          )
        );
        marker.addTo(map);
        markers.push({ marker: marker, feature: feature, index: index });
        bounds.push([lat, lng]);
      });

      if (bounds.length === 1) {
        map.setView(bounds[0], 15);
      } else if (bounds.length > 1) {
        map.fitBounds(bounds, { padding: [48, 48], maxZoom: 15 });
      }

      if (features.length) {
        document.getElementById("pub-list").hidden = false;
        document.getElementById("legend").hidden = false;
        renderList();
        renderLegend();
      } else {
        document.getElementById("pub-list").hidden = false;
        document.getElementById("pub-list").innerHTML =
          '<div class="empty">No confirmed pubs in <code>pub_map/pubs.js</code>. Run <code>python3 dashboard/scripts/export_pub_map.py</code> after <code>bruin run</code>.</div>';
      }

      function renderList() {
        var root = document.getElementById("pub-list-items");
        root.innerHTML = "";
        markers.forEach(function (item) {
          var props = item.feature.properties || {};
          var visits = visitsOf(item.feature);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pub-btn";
          btn.innerHTML =
            '<span class="name"></span><span class="meta"></span>';
          btn.querySelector(".name").textContent = props.name || "Pub";
          btn.querySelector(".meta").textContent =
            visits === 1 ? "1 visit" : visits + " visits";
          btn.addEventListener("click", function () {
            map.setView(item.marker.getLatLng(), Math.max(map.getZoom(), 15), { animate: true });
            item.marker.openPopup();
          });
          root.appendChild(btn);
        });
      }

      function renderLegend() {
        var root = document.getElementById("legend-swatches");
        var samples = maxVisits <= 1 ? [1] : [1, maxVisits];
        root.innerHTML = "";
        samples.forEach(function (n) {
          var row = document.createElement("div");
          row.className = "swatch";
          var dot = document.createElement("span");
          dot.className = "dot";
          var px = radiusFor(n, maxVisits) * 2;
          dot.style.width = px + "px";
          dot.style.height = px + "px";
          row.appendChild(dot);
          row.appendChild(document.createTextNode(n === 1 ? "1 visit" : n + " visits"));
          root.appendChild(row);
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    })();
  </script>
</body>
</html>
