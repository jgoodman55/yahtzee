<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yahtzee pub map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <style>
    :root {
      --ink: #1b2430;
      --muted: #5c6b7a;
      --paper: #f7f4ee;
      --panel: rgba(255, 255, 255, 0.94);
      --line: #d9d0c3;
      --amber: #d97706;
      --amber-deep: #b45309;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    #map { position: absolute; inset: 0; }
    .chrome {
      position: absolute;
      z-index: 500;
      top: 12px;
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: min(340px, calc(100vw - 24px));
      pointer-events: none;
    }
    .chrome > * { pointer-events: auto; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(27, 36, 48, 0.12);
      backdrop-filter: blur(10px);
    }
    header.card { padding: 14px 16px 12px; }
    header h1 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }
    .basemap-note {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .seg {
      display: flex;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }
    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 6px 10px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }
    .seg button:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
    .crumb {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.78rem;
    }
    .crumb.is-on { display: flex; }
    .crumb button {
      border: 0;
      background: #f3ebe0;
      border-radius: 999px;
      padding: 4px 8px;
      font: inherit;
      font-size: 0.72rem;
      cursor: pointer;
      color: var(--ink);
    }
    .list {
      padding: 8px;
      max-height: min(42vh, 360px);
      overflow: auto;
    }
    .list h2 {
      margin: 4px 8px 8px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .pub-btn, .borough-btn {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .pub-btn:hover, .pub-btn:focus-visible,
    .borough-btn:hover, .borough-btn:focus-visible { background: #f3ebe0; outline: none; }
    .pub-btn .name, .borough-btn .name { font-weight: 600; }
    .pub-btn .meta, .borough-btn .meta { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
    .pub-btn .row, .borough-btn .row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .legend {
      position: absolute;
      z-index: 500;
      right: 12px;
      bottom: 24px;
      padding: 10px 12px;
      font-size: 0.78rem;
      max-width: min(220px, calc(100vw - 24px));
    }
    .legend strong { display: block; margin-bottom: 6px; }
    .legend .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.35;
    }
    .swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }
    .swatch + .swatch { margin-top: 4px; }
    .choropleth-chip {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(90, 63, 44, 0.35);
      flex: 0 0 auto;
    }
    .pint-pin {
      background: none !important;
      border: none !important;
    }
    .pint-pin svg {
      display: block;
      filter: drop-shadow(0 1px 1px rgba(27, 36, 48, 0.35));
    }
    /* Popup pane is a full-map overlay; let pan/zoom/wheel pass through
       empty space while the card itself stays clickable. */
    .leaflet-popup-pane { pointer-events: none; }
    .leaflet-popup { pointer-events: auto; }
    .leaflet-popup-content { margin: 10px 12px; }
    .leaflet-popup.venue-popup .leaflet-popup-content-wrapper {
      padding: 0;
      overflow: hidden;
      border-radius: 12px;
    }
    .leaflet-popup.venue-popup .leaflet-popup-content {
      margin: 0;
      width: 200px !important;
    }
    .venue-card { width: 200px; }
    .venue-photo img {
      display: block;
      width: 200px;
      height: 120px;
      object-fit: cover;
      background: #efe6d8;
    }
    .venue-photo-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 200px;
      height: 88px;
      background: #f3ebe0;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
      padding: 8px 12px;
    }
    .venue-photo-empty a {
      color: var(--amber-deep);
      font-weight: 600;
      text-decoration: none;
    }
    .venue-photo-empty a:hover { text-decoration: underline; }
    .venue-card-body { padding: 10px 12px 12px; }
    .popup-title { font-weight: 700; margin: 0 0 4px; }
    .popup-meta { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .popup-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
      max-width: 260px;
    }
    .venue-card .popup-note { max-width: none; }
    .popup-credit {
      margin: 6px 0 0;
      color: #8a7b6b;
      font-size: 0.66rem;
      line-height: 1.3;
    }
    .leaflet-tooltip.borough-label {
      background: rgba(255, 248, 237, 0.94);
      border: 1px solid var(--line);
      box-shadow: 0 4px 12px rgba(27, 36, 48, 0.12);
      color: var(--ink);
      font-weight: 600;
      font-size: 0.78rem;
      line-height: 1.2;
    }
    .leaflet-tooltip.borough-label::before { display: none; }
    .borough-badge {
      background: none !important;
      border: none !important;
      pointer-events: none !important;
    }
    .borough-badge.is-hidden {
      display: none !important;
    }
    .borough-label {
      background: rgba(255, 248, 237, 0.9);
      border-radius: 4px;
      padding: 1px 5px 2px;
      box-shadow: 0 1px 2px rgba(27, 36, 48, 0.16);
      color: var(--ink);
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
      text-align: center;
      letter-spacing: -0.01em;
    }
    .borough-label.is-sm { font-size: 10px; }
    .borough-label.is-md { font-size: 12px; }
    .borough-label.is-lg { font-size: 14px; }
    .borough-label .n { font-weight: 800; }
    .empty {
      padding: 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Interactive pub map"></div>
  <div class="chrome">
    <header class="card">
      <h1>Yahtzee pub map</h1>
      <p id="tagline">Same-size pint pins, coloured by unique-day visits. Statement venues from <code>mart_pub_locations</code>, plus pubs with a logged scorecard location.</p>
      <div class="seg" role="group" aria-label="Map layer">
        <button type="button" id="btn-boroughs" aria-pressed="false">Boroughs</button>
        <button type="button" id="btn-pubs" aria-pressed="true">Pubs</button>
      </div>
      <div class="crumb" id="crumb">
        <button type="button" id="btn-back">← Boroughs</button>
        <span id="crumb-label"></span>
      </div>
      <p class="basemap-note">Esri World Light Gray · ONS boroughs (OGL v3.0). Optional MapTiler: <code>?maptiler=KEY</code>.</p>
    </header>
    <section class="card list" id="side-list" hidden>
      <h2 id="list-heading">Venues</h2>
      <div id="list-items"></div>
    </section>
  </div>
  <div class="card legend" id="legend" hidden>
    <strong id="legend-title">Visits (unique days)</strong>
    <div id="legend-swatches"></div>
    <p class="hint" id="legend-hint"></p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="pub_map/pubs.js"></script>
  <script src="pub_map/london_boroughs.js"></script>
  <script>
    (function () {
      var LONDON = [51.5074, -0.1278];
      var OUTSIDE = "Outside London";
      var PINT_W = 16;
      var PINT_H = 20;
      // Pale lager → deep stout/amber by unique-day visit_count.
      var BEER_STOPS = [
        [1, [246, 231, 161]],
        [3, [224, 178, 74]],
        [5, [196, 103, 18]],
        [8, [61, 34, 14]]
      ];
      var SNAP_DEG = 0.01;
      var SHORT_NAMES = {
        "Kensington and Chelsea": "Kensington",
        "City of London": "City",
        "Hammersmith and Fulham": "Hammersmith",
        "Richmond upon Thames": "Richmond",
        "Kingston upon Thames": "Kingston",
        "Barking and Dagenham": "Barking"
      };

      function collection() {
        if (window.PUB_MAP_DATA && window.PUB_MAP_DATA.features) {
          return window.PUB_MAP_DATA;
        }
        return { type: "FeatureCollection", features: [] };
      }

      function boroughCollection() {
        if (window.LONDON_BOROUGHS && window.LONDON_BOROUGHS.features) {
          return window.LONDON_BOROUGHS;
        }
        return { type: "FeatureCollection", features: [] };
      }

      function visitsOf(feature) {
        var raw = feature.properties && feature.properties.visit_count;
        if (raw === 0 || raw === "0") return 0;
        var n = Number(raw);
        return n > 0 ? n : 1;
      }

      function visitLabel(n) {
        if (n === 0) return "No statement visits";
        return n === 1 ? "1 visit" : n + " visits";
      }

      function gamesBlurb(props) {
        var n = Number(props && props.games_played);
        if (!n) return "";
        var erin = Number(props.erin_wins) || 0;
        var jordan = Number(props.jordan_wins) || 0;
        var games = n === 1 ? "1 Yahtzee game" : n + " Yahtzee games";
        return games + " · Erin " + erin + "W · Jordan " + jordan + "W";
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function colorFromStops(value, stops) {
        var n = Math.max(Number(value) || 0, 0);
        if (n <= stops[0][0]) return rgb(stops[0][1]);
        for (var i = 1; i < stops.length; i++) {
          if (n <= stops[i][0]) {
            var t = (n - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
            var a = stops[i - 1][1];
            var b = stops[i][1];
            return rgb([
              Math.round(lerp(a[0], b[0], t)),
              Math.round(lerp(a[1], b[1], t)),
              Math.round(lerp(a[2], b[2], t))
            ]);
          }
        }
        return rgb(stops[stops.length - 1][1]);
      }

      function rgb(parts) {
        return "rgb(" + parts[0] + ", " + parts[1] + ", " + parts[2] + ")";
      }

      function beerColor(visits) {
        return colorFromStops(visits, BEER_STOPS);
      }

      function boroughFill(visits) {
        if (!visits) return "rgba(246, 231, 161, 0.18)";
        var t = visits / Math.max(maxBoroughVisits || 1, 1);
        return colorFromStops(1 + t * 7, BEER_STOPS);
      }

      function pintSvg(fill, width, height) {
        var w = width || PINT_W;
        var h = height || PINT_H;
        return (
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" width="' +
          w +
          '" height="' +
          h +
          '" aria-hidden="true">' +
          '<path d="M21 15.2c2.4 0 4 1.5 4 3.6v3.4c0 2.1-1.6 3.6-4 3.6" fill="none" stroke="#6b4f3a" stroke-width="1.8" stroke-linecap="round"/>' +
          '<path d="M8.2 11.2h15.4l-2.1 23.4c-3.6 1.9-7.8 1.9-11.1 0z" fill="' +
          fill +
          '" stroke="#5a3f2c" stroke-width="1.35" stroke-linejoin="round"/>' +
          '<path d="M8.6 11c2.1-3.1 12.5-3.1 14.6 0C23.2 12.8 20.8 14 16 14s-7.2-1.2-7.4-3z" fill="#fff6e4" stroke="#e6d3b0" stroke-width="0.85"/>' +
          "</svg>"
        );
      }

      function pintIcon(fill) {
        return L.divIcon({
          className: "pint-pin",
          html: pintSvg(fill, PINT_W, PINT_H),
          iconSize: [PINT_W, PINT_H],
          iconAnchor: [PINT_W / 2, PINT_H - 1],
          popupAnchor: [0, -(PINT_H - 2)]
        });
      }

      function pointInRing(lng, lat, ring) {
        var inside = false;
        var j = ring.length - 1;
        for (var i = 0; i < ring.length; i++) {
          var xi = ring[i][0];
          var yi = ring[i][1];
          var xj = ring[j][0];
          var yj = ring[j][1];
          if ((yi > lat) !== (yj > lat) && lng < ((xj - xi) * (lat - yi)) / ((yj - yi) || 1e-12) + xi) {
            inside = !inside;
          }
          j = i;
        }
        return inside;
      }

      function pointInGeom(lng, lat, geom) {
        if (!geom || !geom.coordinates) return false;
        var polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
        for (var p = 0; p < polys.length; p++) {
          var poly = polys[p];
          if (!poly || !poly.length) continue;
          if (pointInRing(lng, lat, poly[0])) {
            var hole = false;
            for (var h = 1; h < poly.length; h++) {
              if (pointInRing(lng, lat, poly[h])) {
                hole = true;
                break;
              }
            }
            if (!hole) return true;
          }
        }
        return false;
      }

      function minVertexDist(lng, lat, geom) {
        var best = Infinity;
        function walk(node) {
          if (!node) return;
          if (typeof node[0] === "number") {
            var dx = node[0] - lng;
            var dy = node[1] - lat;
            var d = dx * dx + dy * dy;
            if (d < best) best = d;
            return;
          }
          for (var i = 0; i < node.length; i++) walk(node[i]);
        }
        walk(geom && geom.coordinates);
        return Math.sqrt(best);
      }

      function londonBBox(features) {
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        features.forEach(function (ft) {
          function walk(node) {
            if (!node) return;
            if (typeof node[0] === "number") {
              if (node[0] < minX) minX = node[0];
              if (node[0] > maxX) maxX = node[0];
              if (node[1] < minY) minY = node[1];
              if (node[1] > maxY) maxY = node[1];
              return;
            }
            for (var i = 0; i < node.length; i++) walk(node[i]);
          }
          walk(ft.geometry && ft.geometry.coordinates);
        });
        return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
      }

      function assignBorough(lng, lat, boroughs, bbox) {
        var i;
        for (i = 0; i < boroughs.length; i++) {
          if (pointInGeom(lng, lat, boroughs[i].geometry)) {
            return boroughs[i].properties.name;
          }
        }
        var inBox =
          lng >= bbox.minX && lng <= bbox.maxX && lat >= bbox.minY && lat <= bbox.maxY;
        if (!inBox) return OUTSIDE;
        var bestName = OUTSIDE;
        var best = SNAP_DEG;
        for (i = 0; i < boroughs.length; i++) {
          var d = minVertexDist(lng, lat, boroughs[i].geometry);
          if (d < best) {
            best = d;
            bestName = boroughs[i].properties.name;
          }
        }
        return bestName;
      }

      function addBasemap(map) {
        var params = new URLSearchParams(window.location.search);
        var maptiler = params.get("maptiler") || params.get("MAPTILER_KEY");
        if (maptiler) {
          L.tileLayer(
            "https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=" + encodeURIComponent(maptiler),
            {
              attribution: '&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
              maxZoom: 19
            }
          ).addTo(map);
          return;
        }
        var esriAttr =
          'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, DeLorme, NAVTEQ';
        var onsAttr =
          'Boroughs <a href="https://geoportal.statistics.gov.uk/">ONS</a> LAD May 2024 BGC · <a href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/">OGL v3.0</a>';
        L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
          { attribution: esriAttr + " · " + onsAttr, maxZoom: 16 }
        ).addTo(map);
        map.createPane("basemapLabels");
        map.getPane("basemapLabels").style.zIndex = 250;
        map.getPane("basemapLabels").style.pointerEvents = "none";
        L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
          { maxZoom: 16, pane: "basemapLabels" }
        ).addTo(map);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function isSafePhotoUrl(url) {
        if (!url) return false;
        var value = String(url);
        if (/^https?:\/\//i.test(value)) return true;
        if (/^pub_map\//.test(value) || /^\.\//.test(value)) return true;
        return false;
      }

      function mapsHref(props) {
        if (props.maps_url && /^https:\/\/www\.google\.com\/maps\//.test(String(props.maps_url))) {
          return props.maps_url;
        }
        var name = props.name || "pub";
        return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name);
      }

      function emptyPhotoHtml(props) {
        return (
          '<div class="venue-photo-empty">' +
          "<span>No photo yet</span>" +
          '<a href="' +
          escapeHtml(mapsHref(props)) +
          '" target="_blank" rel="noopener noreferrer">Google Maps</a>' +
          "</div>"
        );
      }

      function pubPopupHtml(props) {
        var visits = visitsOf({ properties: props });
        var meta = visitLabel(visits);
        var games = gamesBlurb(props);
        if (games) meta += "<br>" + games;
        var photo = "";
        if (isSafePhotoUrl(props.photo_url)) {
          photo =
            '<div class="venue-photo"><img src="' +
            escapeHtml(props.photo_url) +
            '" alt="' +
            escapeHtml(props.name || "Pub") +
            '" width="200" height="120"></div>';
        } else {
          photo = emptyPhotoHtml(props);
        }
        var html =
          '<div class="venue-card">' +
          photo +
          '<div class="venue-card-body">' +
          '<p class="popup-title">' +
          escapeHtml(props.name || "Pub") +
          "</p><p class=\"popup-meta\">" +
          meta +
          "</p>";
        if (props.note) {
          html += '<p class="popup-note">' + escapeHtml(props.note) + "</p>";
        }
        if (props.photo_url && props.photo_attribution) {
          html += '<p class="popup-credit">' + escapeHtml(props.photo_attribution) + "</p>";
        }
        html += "</div></div>";
        return html;
      }

      function bindVenuePopup(marker, props) {
        marker.bindPopup(pubPopupHtml(props), {
          maxWidth: 220,
          minWidth: 200,
          className: "venue-popup",
          autoPan: true,
          keepInView: false,
          closeOnClick: true,
          autoClose: true
        });
        marker.on("popupopen", function (ev) {
          var img = ev.popup.getElement() && ev.popup.getElement().querySelector(".venue-photo img");
          if (!img) return;
          img.addEventListener("error", function () {
            var wrap = img.closest(".venue-photo");
            if (wrap) wrap.outerHTML = emptyPhotoHtml(props);
          });
        });
        marker.on("mouseover", function () {
          this.openPopup();
        });
      }

      function parseHash() {
        var raw = (window.location.hash || "").replace(/^#/, "");
        if (!raw || raw === "pubs") return { mode: "pubs", filter: null };
        if (raw === "boroughs") return { mode: "boroughs", filter: null };
        var match = raw.match(/^borough=(.+)$/);
        if (match) return { mode: "pubs", filter: decodeURIComponent(match[1]) };
        return { mode: "pubs", filter: null };
      }

      function writeHash(mode, filter) {
        var next = "pubs";
        if (mode === "boroughs") next = "boroughs";
        else if (filter) next = "borough=" + encodeURIComponent(filter);
        if ((window.location.hash || "").replace(/^#/, "") !== next) {
          history.replaceState(null, "", "#" + next);
        }
      }

      var data = collection();
      var features = data.features || [];
      var boroughs = boroughCollection().features || [];
      var bbox = londonBBox(boroughs);
      var maxPubVisits = features.reduce(function (max, f) {
        return Math.max(max, visitsOf(f));
      }, 1);

      features.forEach(function (feature) {
        var coords = feature.geometry && feature.geometry.coordinates;
        var props = feature.properties || {};
        props.borough = coords
          ? assignBorough(coords[0], coords[1], boroughs, bbox)
          : OUTSIDE;
        feature.properties = props;
      });

      var boroughStats = {};
      boroughs.forEach(function (ft) {
        boroughStats[ft.properties.name] = { name: ft.properties.name, visits: 0, pubs: 0, feature: ft };
      });
      boroughStats[OUTSIDE] = { name: OUTSIDE, visits: 0, pubs: 0, feature: null };
      features.forEach(function (feature) {
        var name = feature.properties.borough || OUTSIDE;
        if (!boroughStats[name]) {
          boroughStats[name] = { name: name, visits: 0, pubs: 0, feature: null };
        }
        boroughStats[name].visits += visitsOf(feature);
        boroughStats[name].pubs += 1;
      });
      var maxBoroughVisits = Object.keys(boroughStats).reduce(function (max, key) {
        if (key === OUTSIDE) return max;
        return Math.max(max, boroughStats[key].visits);
      }, 1);

      var map = L.map("map", {
        center: LONDON,
        zoom: 12,
        zoomControl: false
      });
      L.control.zoom({ position: "topright" }).addTo(map);
      addBasemap(map);

      var boroughLayer = L.layerGroup();
      var boroughLabelLayer = L.layerGroup();
      var pubLayer = L.layerGroup();
      var outsideLayer = L.layerGroup();
      var pubMarkers = [];
      var londonBounds = boroughs.length
        ? L.geoJSON({ type: "FeatureCollection", features: boroughs }).getBounds()
        : L.latLngBounds([LONDON, LONDON]);

      L.geoJSON(
        { type: "FeatureCollection", features: boroughs },
        {
          style: function (feature) {
            var stats = boroughStats[feature.properties.name] || { visits: 0 };
            var hasVisits = stats.visits > 0;
            return {
              color: hasVisits ? "#5a3f2c" : "#e6d3b0",
              weight: hasVisits ? 1.15 : 0.8,
              opacity: hasVisits ? 0.9 : 0.4,
              fillColor: boroughFill(stats.visits),
              fillOpacity: hasVisits ? 0.78 : 0.16
            };
          },
          onEachFeature: function (feature, layer) {
            var stats = boroughStats[feature.properties.name] || { visits: 0, pubs: 0 };
            var label =
              stats.visits === 1 ? "1 visit" : stats.visits + " visits";
            layer.bindTooltip(
              escapeHtml(feature.properties.name) + " · " + label,
              { sticky: true, direction: "top", opacity: 0.95 }
            );
            layer.bindPopup(
              '<p class="popup-title">' +
                escapeHtml(feature.properties.name) +
                "</p><p class=\"popup-meta\">" +
                label +
                (stats.pubs ? " · " + stats.pubs + (stats.pubs === 1 ? " pub" : " pubs") : "") +
                "</p>"
            );
            layer.on("click", function () {
              if (stats.visits > 0) setView("pubs", feature.properties.name);
            });
          }
        }
      ).eachLayer(function (layer) {
        boroughLayer.addLayer(layer);
      });

      var boroughLabelItems = [];
      Object.keys(boroughStats).forEach(function (name) {
        var stats = boroughStats[name];
        if (!stats.visits || !stats.feature) return;
        var bounds = L.geoJSON(stats.feature).getBounds();
        if (!bounds.isValid()) return;
        var home = bounds.getCenter();
        var marker = L.marker(home, {
          icon: boroughLabelIcon(name, stats.visits, 10, true),
          interactive: false,
          keyboard: false
        });
        boroughLabelLayer.addLayer(marker);
        boroughLabelItems.push({
          name: name,
          visits: stats.visits,
          area: (bounds.getEast() - bounds.getWest()) * (bounds.getNorth() - bounds.getSouth()),
          home: home,
          marker: marker
        });
      });

      function labelZoomStyle(zoom) {
        if (zoom >= 14) return { size: "lg", charW: 7.6, h: 18, pad: 10 };
        if (zoom >= 12) return { size: "md", charW: 6.7, h: 16, pad: 8 };
        return { size: "sm", charW: 5.9, h: 14, pad: 7 };
      }

      function displayBoroughName(name, zoom) {
        if (zoom >= 13) return name;
        return SHORT_NAMES[name] || name;
      }

      function boroughLabelIcon(name, visits, zoom, hidden) {
        if (hidden) {
          return L.divIcon({
            className: "borough-badge is-hidden",
            html: "",
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });
        }
        var z = labelZoomStyle(zoom);
        var short = displayBoroughName(name, zoom);
        var html =
          '<div class="borough-label is-' +
          z.size +
          '">' +
          escapeHtml(short) +
          ' <span class="n">' +
          visits +
          "</span></div>";
        var width = Math.ceil((short + " " + visits).length * z.charW + z.pad);
        return L.divIcon({
          className: "borough-badge",
          html: html,
          iconSize: [width, z.h],
          iconAnchor: [width / 2, z.h / 2]
        });
      }

      function resolveBoroughLabelCollisions() {
        if (!map.hasLayer(boroughLabelLayer) || !boroughLabelItems.length) return;
        var zoom = map.getZoom();
        var style = labelZoomStyle(zoom);
        var gap = 3;
        var placed = [];
        boroughLabelItems
          .slice()
          .sort(function (a, b) {
            if (b.visits !== a.visits) return b.visits - a.visits;
            return b.area - a.area;
          })
          .forEach(function (item) {
            var pt = map.latLngToContainerPoint(item.home);
            var short = displayBoroughName(item.name, zoom);
            var width = Math.ceil((short + " " + item.visits).length * style.charW + style.pad);
            var hw = width / 2;
            var hh = style.h / 2;
            var hidden = false;
            for (var i = 0; i < placed.length; i++) {
              var other = placed[i];
              if (
                Math.abs(pt.x - other.x) < hw + other.hw + gap &&
                Math.abs(pt.y - other.y) < hh + other.hh + gap
              ) {
                hidden = true;
                break;
              }
            }
            item.marker.setLatLng(item.home);
            item.marker.setIcon(boroughLabelIcon(item.name, item.visits, zoom, hidden));
            if (!hidden) placed.push({ x: pt.x, y: pt.y, hw: hw, hh: hh });
          });
      }

      map.on("zoomend moveend", resolveBoroughLabelCollisions);

      features.forEach(function (feature, index) {
        var coords = feature.geometry && feature.geometry.coordinates;
        if (!coords) return;
        var lng = coords[0];
        var lat = coords[1];
        var props = feature.properties || {};
        var visits = visitsOf(feature);
        var marker = L.marker([lat, lng], {
          icon: pintIcon(beerColor(visits)),
          title: props.name || "Pub",
          keyboard: true,
          riseOnHover: true
        });
        bindVenuePopup(marker, props);
        var item = {
          marker: marker,
          feature: feature,
          index: index,
          borough: props.borough || OUTSIDE
        };
        pubMarkers.push(item);
        if (item.borough === OUTSIDE) {
          var outsideMarker = L.marker([lat, lng], {
            icon: pintIcon(beerColor(visits)),
            title: props.name || "Pub",
            riseOnHover: true
          });
          bindVenuePopup(outsideMarker, props);
          outsideMarker.on("click", function () {
            setView("pubs", OUTSIDE);
          });
          outsideLayer.addLayer(outsideMarker);
        }
      });

      function visiblePubItems(filter) {
        if (!filter) return pubMarkers;
        return pubMarkers.filter(function (item) {
          return item.borough === filter;
        });
      }

      function syncPubLayer(filter) {
        pubLayer.clearLayers();
        visiblePubItems(filter).forEach(function (item) {
          pubLayer.addLayer(item.marker);
        });
      }

      function fitTo(items, fallbackLondon) {
        var pts = [];
        items.forEach(function (item) {
          pts.push(item.marker.getLatLng());
        });
        if (pts.length === 1) {
          map.setView(pts[0], 15, { animate: true });
          return;
        }
        if (pts.length > 1) {
          map.fitBounds(pts, { padding: [48, 48], maxZoom: 15, animate: true });
          return;
        }
        if (fallbackLondon && londonBounds.isValid()) {
          map.fitBounds(londonBounds, { padding: [24, 24], maxZoom: 12, animate: true });
        }
      }

      function setView(mode, filter, opts) {
        opts = opts || {};
        var skipFit = !!opts.skipFit;
        if (mode === "boroughs") filter = null;
        writeHash(mode, filter);

        document.getElementById("btn-boroughs").setAttribute("aria-pressed", mode === "boroughs" ? "true" : "false");
        document.getElementById("btn-pubs").setAttribute("aria-pressed", mode === "pubs" ? "true" : "false");

        var crumb = document.getElementById("crumb");
        var tagline = document.getElementById("tagline");
        var heading = document.getElementById("list-heading");

        if (mode === "boroughs") {
          map.removeLayer(pubLayer);
          boroughLayer.addTo(map);
          boroughLabelLayer.addTo(map);
          outsideLayer.addTo(map);
          crumb.classList.remove("is-on");
          tagline.textContent =
            "Borough visit totals (same pale-lager → stout ramp as the pints). Labels show name + visits; crowded ones hide until you zoom in. Click a borough for its pins.";
          heading.textContent = "Boroughs";
          if (!skipFit && londonBounds.isValid()) {
            map.fitBounds(londonBounds, { padding: [28, 28], maxZoom: 12, animate: true });
          }
          resolveBoroughLabelCollisions();
        } else {
          map.removeLayer(boroughLayer);
          map.removeLayer(boroughLabelLayer);
          map.removeLayer(outsideLayer);
          syncPubLayer(filter);
          pubLayer.addTo(map);
          if (filter) {
            var stats = boroughStats[filter] || { visits: 0, pubs: 0 };
            crumb.classList.add("is-on");
            document.getElementById("crumb-label").textContent =
              filter +
              " · " +
              stats.pubs +
              (stats.pubs === 1 ? " pub" : " pubs") +
              " · " +
              (stats.visits === 1 ? "1 visit" : stats.visits + " visits");
            tagline.textContent =
              "Pint pins in " + filter + " — same size, colour by unique-day visits.";
            heading.textContent = "Venues";
            if (!skipFit) fitTo(visiblePubItems(filter), true);
          } else {
            crumb.classList.remove("is-on");
            tagline.textContent =
              "Same-size pint pins, coloured by unique-day visits. Statement venues, plus pubs with a logged scorecard location.";
            heading.textContent = "Venues";
            if (!skipFit) {
              if (londonBounds.isValid()) {
                map.fitBounds(londonBounds, { padding: [28, 28], maxZoom: 12, animate: true });
              } else {
                fitTo(pubMarkers, true);
              }
            }
          }
        }
        renderList(mode, filter);
        renderLegend(mode);
      }

      function renderList(mode, filter) {
        var root = document.getElementById("list-items");
        var list = document.getElementById("side-list");
        root.innerHTML = "";
        if (mode === "boroughs") {
          var rows = Object.keys(boroughStats)
            .map(function (key) { return boroughStats[key]; })
            .filter(function (row) { return row.visits > 0; })
            .sort(function (a, b) {
              if (b.visits !== a.visits) return b.visits - a.visits;
              return a.name.localeCompare(b.name);
            });
          rows.forEach(function (row) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "borough-btn";
            btn.innerHTML =
              '<span class="row"><span class="choropleth-chip"></span><span class="name"></span></span><span class="meta"></span>';
            btn.querySelector(".choropleth-chip").style.background =
              row.name === OUTSIDE ? beerColor(Math.max(1, Math.round(row.visits / Math.max(row.pubs, 1)))) : boroughFill(row.visits);
            btn.querySelector(".name").textContent = row.name;
            btn.querySelector(".meta").textContent =
              row.visits === 1 ? "1 visit" : row.visits + " visits";
            btn.addEventListener("click", function () {
              setView("pubs", row.name);
            });
            root.appendChild(btn);
          });
          list.hidden = false;
          return;
        }
        var items = visiblePubItems(filter).slice().sort(function (a, b) {
          var dv = visitsOf(b.feature) - visitsOf(a.feature);
          if (dv) return dv;
          return String(a.feature.properties.name || "").localeCompare(b.feature.properties.name || "");
        });
        items.forEach(function (item) {
          var props = item.feature.properties || {};
          var visits = visitsOf(item.feature);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pub-btn";
          btn.innerHTML =
            '<span class="row"><span class="pint-pin"></span><span class="name"></span></span><span class="meta"></span>';
          btn.querySelector(".pint-pin").innerHTML = pintSvg(beerColor(visits), 14, 18);
          btn.querySelector(".name").textContent = props.name || "Pub";
          var meta = visitLabel(visits);
          var games = gamesBlurb(props);
          btn.querySelector(".meta").textContent = games ? meta + " · " + games : meta;
          btn.addEventListener("click", function () {
            var latlng = item.marker.getLatLng();
            var targetZoom = Math.max(map.getZoom(), 14);
            function showPopup() {
              item.marker.openPopup();
            }
            if (map.getZoom() >= 14 && map.getBounds().pad(-0.15).contains(latlng)) {
              showPopup();
              return;
            }
            map.once("moveend", showPopup);
            map.setView(latlng, targetZoom, { animate: true });
          });
          root.appendChild(btn);
        });
        list.hidden = false;
      }

      function renderLegend(mode) {
        var root = document.getElementById("legend-swatches");
        var title = document.getElementById("legend-title");
        var hint = document.getElementById("legend-hint");
        var box = document.getElementById("legend");
        root.innerHTML = "";
        if (mode === "boroughs") {
          title.textContent = "Borough visits (unique days)";
          var samples = [1, Math.max(3, Math.round(maxBoroughVisits / 4)), Math.max(5, Math.round(maxBoroughVisits / 2)), maxBoroughVisits];
          var seen = {};
          samples.forEach(function (n) {
            if (seen[n]) return;
            seen[n] = true;
            var row = document.createElement("div");
            row.className = "swatch";
            var icon = document.createElement("span");
            icon.className = "pint-pin";
            icon.innerHTML = pintSvg(boroughFill(n), 14, 18);
            row.appendChild(icon);
            row.appendChild(document.createTextNode(n === 1 ? "1" : String(n)));
            root.appendChild(row);
          });
          hint.textContent = "Same pale-lager → stout ramp as the pint pins. Name labels hide on collision; zoom in to see more. Click a borough for its pins.";
        } else {
          title.textContent = "Visits (unique days)";
          var beerSamples = [1, 3, 5, Math.max(8, maxPubVisits)];
          var uniq = {};
          beerSamples.forEach(function (n) {
            if (uniq[n]) return;
            uniq[n] = true;
            var row = document.createElement("div");
            row.className = "swatch";
            var icon = document.createElement("span");
            icon.className = "pint-pin";
            icon.innerHTML = pintSvg(beerColor(n), 14, 18);
            row.appendChild(icon);
            row.appendChild(document.createTextNode(n === 1 ? "1" : String(n)));
            root.appendChild(row);
          });
          hint.textContent = "Same-size lager pint · pale → stout by unique-day visits. Click or hover a pin for photo + address.";
        }
        box.hidden = false;
      }

      document.getElementById("btn-boroughs").addEventListener("click", function () {
        setView("boroughs", null);
      });
      document.getElementById("btn-pubs").addEventListener("click", function () {
        setView("pubs", null);
      });
      document.getElementById("btn-back").addEventListener("click", function () {
        setView("boroughs", null);
      });
      window.addEventListener("hashchange", function () {
        var parsed = parseHash();
        setView(parsed.mode, parsed.filter, { skipFit: false });
      });

      if (!features.length) {
        document.getElementById("side-list").hidden = false;
        document.getElementById("side-list").innerHTML =
          '<div class="empty">No confirmed pubs in <code>pub_map/pubs.js</code>. Run <code>python3 dashboard/scripts/export_pub_map.py</code> after <code>bruin run</code>.</div>';
        return;
      }

      var initial = parseHash();
      setView(initial.mode, initial.filter);
    })();
  </script>
</body>
</html>
