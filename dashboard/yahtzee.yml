# DAC dashboard definition. DAC is a separate binary from the Bruin CLI
# (bruin-data/dac) — run `dac init` alongside this pipeline, point it at the
# same .bruin.yml connections, then `dac validate --dir dashboard` before
# trusting the exact widget schema below; it's a reasonable starting point
# but DAC's YAML shape is worth confirming against `dac validate`'s output.
title: Yahtzee Head-to-Head
description: Jordan vs. partner — every game, ordered by sequence not date.

widgets:
  - type: stat
    title: Total games
    query: select count(*) as value from mart_head_to_head

  - type: stat
    title: Jordan wins
    query: select max(jordan_cum_wins) as value from mart_head_to_head

  - type: stat
    title: Partner wins
    query: select max(partner_cum_wins) as value from mart_head_to_head

  - type: line
    title: Cumulative wins by game sequence
    query: |
      select game_seq, jordan_cum_wins, partner_cum_wins
      from mart_head_to_head
      order by game_seq
    x: game_seq
    y: [jordan_cum_wins, partner_cum_wins]

  - type: bar
    title: Margin of victory by game
    query: select game_seq, winner, margin from mart_head_to_head order by game_seq
    x: game_seq
    y: margin

  - type: table
    title: Commentary log
    query: |
      select game_seq, winner, margin_comment, yahtzee_comment, bonus_comment, streak_comment
      from mart_head_to_head
      order by game_seq desc

  - type: markdown
    title: Win-race animation
    content: |
      Rendered separately via `visuals/win_race_animation.py` (matplotlib,
      not a DAC-native widget). Drop the exported `win_race.mp4`/`.gif` next
      to this dashboard and embed it, or link out to it.
