schema: https://getbruin.com/schemas/dac/dashboard/v1
name: Yahtzee Head-to-Head
description: Who is ahead, and which boxes turn into wins.
connection: local_duckdb

# Colors: Erin #FF2D92, Jordan #2D9CFF, grey #6D7889 for a coin-flip line,
# an upset, or a sample under 5 games. Serve with --template yahtzee-dark.
# Row heights are quoted strings. DAC 0.21 turns a bare number into CSS that
# crushes stacked cards below 640px. Field definitions (recorded_total vs
# computed_total, the Vega href pattern, DAC 0.21 limits) live in
# dashboard/README.md.

x-vl-dark: &vl_dark
  background: transparent
  view: { stroke: null }
  axis:
    labelColor: "#A8B3C5"
    titleColor: "#A8B3C5"
    gridColor: "#2A3344"
    domainColor: "#2A3344"
    tickColor: "#2A3344"
  legend:
    labelColor: "#F3F6FA"
    title: null
    orient: bottom

x-player-color: &player_color
  field: player
  type: nominal
  scale:
    domain: ["Erin", "Jordan"]
    range: ["#FF2D92", "#2D9CFF"]
  legend: { title: null, orient: bottom }

x-bar-label: &bar_label
  type: text
  dy: -8
  fontSize: 11
  fontWeight: 600
  color: "#F3F6FA"

x-name-erin: &name_erin
  type: text
  fontSize: 12
  fontWeight: 600
  align: center
  baseline: middle
  x: { expr: "width * 0.28" }
  y: { expr: "height * 0.16" }
  color: "#FF2D92"

x-name-jordan: &name_jordan
  type: text
  fontSize: 12
  fontWeight: 600
  align: center
  baseline: middle
  x: { expr: "width * 0.72" }
  y: { expr: "height * 0.16" }
  color: "#2D9CFF"

x-num-erin: &num_erin
  type: text
  fontSize: 26
  fontWeight: 600
  align: center
  baseline: middle
  x: { expr: "width * 0.28" }
  y: { expr: "height * 0.50" }
  color: "#FF2D92"

x-num-jordan: &num_jordan
  type: text
  fontSize: 26
  fontWeight: 600
  align: center
  baseline: middle
  x: { expr: "width * 0.72" }
  y: { expr: "height * 0.50" }
  color: "#2D9CFF"

x-sub-erin: &sub_erin
  type: text
  fontSize: 13
  fontWeight: 600
  align: center
  baseline: middle
  x: { expr: "width * 0.28" }
  y: { expr: "height * 0.82" }
  color: "#FF2D92"

x-sub-jordan: &sub_jordan
  type: text
  fontSize: 13
  fontWeight: 600
  align: center
  baseline: middle
  x: { expr: "width * 0.72" }
  y: { expr: "height * 0.82" }
  color: "#2D9CFF"

x-link-erin: &link_erin
  type: text
  fontSize: 26
  fontWeight: 600
  align: center
  baseline: middle
  cursor: pointer
  x: { expr: "width * 0.28" }
  y: { expr: "height * 0.50" }
  color: "#FF2D92"

x-link-jordan: &link_jordan
  type: text
  fontSize: 26
  fontWeight: 600
  align: center
  baseline: middle
  cursor: pointer
  x: { expr: "width * 0.72" }
  y: { expr: "height * 0.50" }
  color: "#2D9CFF"

x-gap: &gap_mark
  type: text
  fontSize: 12
  fontWeight: 600
  align: center
  baseline: middle
  x: { expr: "width / 2" }
  y: { expr: "height * 0.84" }
  color: "#A8B3C5"

x-pair-view: &pair_view
  background: transparent
  view: { stroke: null }

queries:
  headline:
    sql: |
      select
        h.*,
        (select total_yahtzees from mart_player_kpis where player_key = 'erin') as erin_total_yahtzees,
        (select total_yahtzees from mart_player_kpis where player_key = 'jordan') as jordan_total_yahtzees,
        '/scorecards/viewer.html?game=' || h.erin_high_score_game_seq as erin_high_score_url,
        '/scorecards/viewer.html?game=' || h.jordan_high_score_game_seq as jordan_high_score_url,
        '/scorecards/viewer.html?game=' || h.erin_low_score_game_seq as erin_low_score_url,
        '/scorecards/viewer.html?game=' || h.jordan_low_score_game_seq as jordan_low_score_url
      from mart_headline_kpis h
  solo_yahtzee:
    sql: |
      select
        max(case when holder = 'Erin' then holder_win_rate end) as erin_rate,
        max(case when holder = 'Jordan' then holder_win_rate end) as jordan_rate,
        max(case when holder = 'Erin' then holder_wins || '/' || n_holder end) as erin_record,
        max(case when holder = 'Jordan' then holder_wins || '/' || n_holder end) as jordan_record
      from mart_yz_matchup
  races:
    sql: |
      select
        game_seq,
        erin_cum_wins as "Erin",
        jordan_cum_wins as "Jordan"
      from mart_game_trends
      order by game_seq
  cum_yahtzees:
    sql: |
      select
        game_seq,
        erin_cum_yahtzees as "Erin",
        jordan_cum_yahtzees as "Jordan"
      from mart_game_trends
      order by game_seq
  multi_yahtzee_cum:
    sql: |
      select
        game_seq,
        erin_cum_multi_yahtzee_games as "Erin",
        jordan_cum_multi_yahtzee_games as "Jordan"
      from mart_game_trends
      order by game_seq
  yahtzee_dist:
    sql: |
      with buckets as (
        select * from (values (1, '0'), (2, '1'), (3, '2'), (4, '3+')) t(bucket_ord, bucket)
      ),
      raw as (
        select
          'Erin' as player,
          case
            when erin_yahtzees >= 3 then '3+'
            when erin_yahtzees >= 2 then '2'
            when erin_yahtzees >= 1 then '1'
            else '0'
          end as bucket
        from mart_game_trends
        union all
        select
          'Jordan',
          case
            when jordan_yahtzees >= 3 then '3+'
            when jordan_yahtzees >= 2 then '2'
            when jordan_yahtzees >= 1 then '1'
            else '0'
          end
        from mart_game_trends
      )
      select
        b.bucket,
        b.bucket_ord,
        p.player,
        count(r.bucket)::integer as games
      from buckets b
      cross join (select 'Erin' as player union all select 'Jordan') p
      left join raw r
        on r.bucket = b.bucket
       and r.player = p.player
      group by b.bucket, b.bucket_ord, p.player
      order by b.bucket_ord, p.player
  scratch_dist:
    sql: |
      with raw as (
        select 'Erin' as player, erin_zeros::integer as scratches
        from mart_game_trends
        union all
        select 'Jordan', jordan_zeros::integer
        from mart_game_trends
      ),
      counts as (
        select player, scratches, count(*)::integer as n
        from raw
        group by player, scratches
      ),
      totals as (
        select player, count(*)::integer as total
        from raw
        group by player
      ),
      buckets as (
        select * from (values (0), (1), (2), (3), (4), (5)) t(scratches)
      )
      select
        p.player,
        b.scratches,
        coalesce(c.n, 0) as n,
        t.total,
        coalesce(c.n, 0)::double / t.total as share,
        case
          when coalesce(c.n, 0) = 0 then ''
          else round(100.0 * c.n / t.total)::integer || '%'
        end as pct_label,
        case
          when coalesce(c.n, 0) = 0 then ''
          else '(' || c.n || '/' || t.total || ')'
        end as count_label
      from (select distinct player from raw) p
      cross join buckets b
      inner join totals t on t.player = p.player
      left join counts c
        on c.player = p.player
       and c.scratches = b.scratches
      order by p.player, b.scratches
  conversion_miss:
    sql: |
      select
        case category
          when 'four_of_a_kind' then 'Four of a kind'
          when 'full_house' then 'Full house'
          when 'small_straight' then 'Small straight'
          when 'large_straight' then 'Large straight'
          when 'yahtzee' then 'Yahtzee'
        end as category,
        case category
          when 'four_of_a_kind' then 1
          when 'full_house' then 2
          when 'small_straight' then 3
          when 'large_straight' then 4
          when 'yahtzee' then 5
        end as category_ord,
        max(case when player_key = 'erin' then miss_rate end) as "Erin",
        max(case when player_key = 'jordan' then miss_rate end) as "Jordan"
      from mart_category_stats
      where category in (
        'four_of_a_kind', 'full_house', 'small_straight', 'large_straight', 'yahtzee'
      )
      group by category
      order by category_ord
  upper_avg_dice:
    sql: |
      select
        case category
          when 'ones' then 'Ones'
          when 'twos' then 'Twos'
          when 'threes' then 'Threes'
          when 'fours' then 'Fours'
          when 'fives' then 'Fives'
          when 'sixes' then 'Sixes'
        end as face,
        min(category_ord) as face_ord,
        max(case when player_key = 'erin' then avg_dice_count end) as "Erin",
        max(case when player_key = 'jordan' then avg_dice_count end) as "Jordan"
      from mart_category_stats
      where section = 'upper'
      group by category
      order by face_ord
  lower_sum_avg:
    sql: |
      select
        case category
          when 'three_of_a_kind' then 'Three of a kind'
          when 'four_of_a_kind' then 'Four of a kind'
          when 'chance' then 'Chance'
        end as category,
        min(category_ord) as category_ord,
        max(case when player_key = 'erin' then avg_score end) as "Erin",
        max(case when player_key = 'jordan' then avg_score end) as "Jordan"
      from mart_category_stats
      where is_sum_box
      group by category
      order by category_ord
  score_margins:
    sql: |
      select 'Erin' as player, margin
      from mart_game_trends
      where winner = 'erin'
      union all
      select 'Jordan', margin
      from mart_game_trends
      where winner = 'jordan'
  score_totals:
    sql: |
      select 'Erin' as player, erin_recorded_total as recorded_total
      from mart_game_trends
      union all
      select 'Jordan', jordan_recorded_total
      from mart_game_trends
  closest_scorecard_links:
    sql: |
      select
        game_seq,
        upper(substr(winner, 1, 1)) || substr(winner, 2) as winner,
        'Game ' || game_seq || ' · ' || upper(substr(winner, 1, 1)) || substr(winner, 2) || ' by ' || margin as label,
        '/scorecards/viewer.html?game=' || game_seq as url
      from mart_game_trends
      order by margin asc, game_seq
      limit 8
  blowout_scorecard_links:
    sql: |
      select
        game_seq,
        upper(substr(winner, 1, 1)) || substr(winner, 2) as winner,
        'Game ' || game_seq || ' · ' || upper(substr(winner, 1, 1)) || substr(winner, 2) || ' by ' || margin as label,
        '/scorecards/viewer.html?game=' || game_seq as url
      from mart_game_trends
      order by margin desc, game_seq
      limit 8
  strategy_swing:
    sql: |
      select
        feature,
        feature_ord,
        n,
        holder_wins,
        holder_win_rate,
        case when n < 5 then 'low_n' else 'ok' end as tone,
        label
      from mart_strategy_swing
      order by holder_win_rate desc, n desc, feature
  strategy_rescue:
    sql: |
      select
        miss,
        miss_ord,
        consolation,
        cons_ord,
        n,
        focal_win_rate,
        case
          when n = 0 then 'empty'
          when n < 5 then 'low_n'
          else 'ok'
        end as tone,
        label
      from mart_strategy_rescue
      order by miss_ord, cons_ord
  yz_matchup:
    sql: |
      select
        holder_ord,
        holder,
        holder_label,
        outcome_ord,
        outcome,
        n,
        n_holder,
        holder_wins,
        holder_losses,
        holder_win_rate,
        n::double / nullif(n_holder, 0) as share,
        label,
        case
          when outcome = 'Holder won' then n::varchar || 'W'
          else n::varchar || 'L'
        end as wl_label,
        stack_key
      from mart_yz_matchup
      order by holder_ord, outcome_ord
  location_win_rates:
    sql: |
      select
        location || ' (n=' || games || ')' as location_label,
        games,
        player,
        win_rate
      from (
        select location, games, 'Erin' as player,
          erin_wins::double / games as win_rate
        from mart_location_stats
        union all
        select location, games, 'Jordan',
          jordan_wins::double / games
        from mart_location_stats
      ) rates
      order by games desc, location, player

rows:
  # Family landing row. DAC 0.21 cannot iframe the map, so this is a
  # full-card link. The Pub tab keeps its own map link. Scorecards stay
  # on the Game tab.
  - tab: Top
    height: "148"
    widgets:
      - name: Pub map
        type: chart
        chart: vega-lite
        col: 12
        description: Opens the map of pubs.
        data:
          columns: [url, title, sub]
          rows:
            - ["/pub_map.html", "See where we've played →", "Pub map"]
        spec:
          width: container
          padding: 0
          data: { name: dac }
          config: *pair_view
          layer:
            - mark:
                type: rect
                cursor: pointer
                color: "#1A2130"
                x: { expr: "0" }
                y: { expr: "0" }
                x2: { expr: "width" }
                y2: { expr: "height" }
              encoding:
                href: { field: url, type: nominal }
            - mark:
                type: text
                align: center
                baseline: middle
                fontSize: 20
                fontWeight: 600
                color: "#F3F6FA"
                cursor: pointer
                y: { expr: "height * 0.42" }
              encoding:
                text: { field: title, type: nominal }
                href: { field: url, type: nominal }
            - mark:
                type: text
                align: center
                baseline: middle
                fontSize: 13
                fontWeight: 600
                color: "#A8B3C5"
                cursor: pointer
                y: { expr: "height * 0.72" }
              encoding:
                text: { field: sub, type: nominal }
                href: { field: url, type: nominal }

  - tab: Top
    height: "188"
    widgets:
      - name: Streak
        type: chart
        chart: vega-lite
        col: 3
        description: Wins in a row right now. Small type is the longest run.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *num_erin
              encoding:
                text: { field: erin_current_streak, type: quantitative, format: ",.0f" }
            - mark: *num_jordan
              encoding:
                text: { field: jordan_current_streak, type: quantitative, format: ",.0f" }
            - mark: *sub_erin
              transform:
                - calculate: "'best ' + format(datum.erin_longest_streak, '.0f')"
                  as: erin_best
              encoding:
                text: { field: erin_best, type: nominal }
            - mark: *sub_jordan
              transform:
                - calculate: "'best ' + format(datum.jordan_longest_streak, '.0f')"
                  as: jordan_best
              encoding:
                text: { field: jordan_best, type: nominal }

      - name: Wins
        type: chart
        chart: vega-lite
        col: 3
        description: Games won, from the sum of the boxes.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *num_erin
              encoding:
                text: { field: erin_wins, type: quantitative, format: ",.0f" }
            - mark: *num_jordan
              encoding:
                text: { field: jordan_wins, type: quantitative, format: ",.0f" }
            - mark: *gap_mark
              transform:
                - calculate: "datum.erin_wins === datum.jordan_wins ? 'Level' : datum.jordan_wins > datum.erin_wins ? 'Jordan +' + format(datum.jordan_wins - datum.erin_wins, '.0f') : 'Erin +' + format(datum.erin_wins - datum.jordan_wins, '.0f')"
                  as: gap_label
              encoding:
                text: { field: gap_label, type: nominal }

      - name: Average
        type: chart
        chart: vega-lite
        col: 3
        description: Average total written on the card.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *num_erin
              encoding:
                text: { field: erin_avg_score, type: quantitative, format: ",.1f" }
            - mark: *num_jordan
              encoding:
                text: { field: jordan_avg_score, type: quantitative, format: ",.1f" }
            - mark: *gap_mark
              transform:
                - calculate: "abs(datum.erin_avg_score - datum.jordan_avg_score) < 0.05 ? 'Level' : datum.jordan_avg_score > datum.erin_avg_score ? 'Jordan +' + format(datum.jordan_avg_score - datum.erin_avg_score, '.1f') : 'Erin +' + format(datum.erin_avg_score - datum.jordan_avg_score, '.1f')"
                  as: gap_label
              encoding:
                text: { field: gap_label, type: nominal }

      - name: Median
        type: chart
        chart: vega-lite
        col: 3
        description: Median total written on the card.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *num_erin
              encoding:
                text: { field: erin_median_score, type: quantitative, format: ",.0f" }
            - mark: *num_jordan
              encoding:
                text: { field: jordan_median_score, type: quantitative, format: ",.0f" }
            - mark: *gap_mark
              transform:
                - calculate: "datum.erin_median_score === datum.jordan_median_score ? 'Level' : datum.jordan_median_score > datum.erin_median_score ? 'Jordan +' + format(datum.jordan_median_score - datum.erin_median_score, '.0f') : 'Erin +' + format(datum.erin_median_score - datum.jordan_median_score, '.0f')"
                  as: gap_label
              encoding:
                text: { field: gap_label, type: nominal }

  - tab: Top
    height: "168"
    widgets:
      - name: High score
        type: chart
        chart: vega-lite
        col: 6
        description: Best total written on the card. Click a number to open that game.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          usermeta:
            embedOptions:
              loader:
                target: _blank
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *link_erin
              encoding:
                text: { field: erin_high_score, type: quantitative, format: ",.0f" }
                href: { field: erin_high_score_url, type: nominal }
                tooltip:
                  - { field: erin_high_score_game_seq, type: quantitative, title: Game, format: d }
            - mark: *link_jordan
              encoding:
                text: { field: jordan_high_score, type: quantitative, format: ",.0f" }
                href: { field: jordan_high_score_url, type: nominal }
                tooltip:
                  - { field: jordan_high_score_game_seq, type: quantitative, title: Game, format: d }
            - mark: *gap_mark
              transform:
                - calculate: "datum.erin_high_score === datum.jordan_high_score ? 'Level' : datum.jordan_high_score > datum.erin_high_score ? 'Jordan +' + format(datum.jordan_high_score - datum.erin_high_score, '.0f') : 'Erin +' + format(datum.erin_high_score - datum.jordan_high_score, '.0f')"
                  as: gap_label
              encoding:
                text: { field: gap_label, type: nominal }

      - name: Low score
        type: chart
        chart: vega-lite
        col: 6
        description: Lowest total written on the card. Click a number to open that game.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          usermeta:
            embedOptions:
              loader:
                target: _blank
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *link_erin
              encoding:
                text: { field: erin_low_score, type: quantitative, format: ",.0f" }
                href: { field: erin_low_score_url, type: nominal }
                tooltip:
                  - { field: erin_low_score_game_seq, type: quantitative, title: Game, format: d }
            - mark: *link_jordan
              encoding:
                text: { field: jordan_low_score, type: quantitative, format: ",.0f" }
                href: { field: jordan_low_score_url, type: nominal }
                tooltip:
                  - { field: jordan_low_score_game_seq, type: quantitative, title: Game, format: d }
            - mark: *gap_mark
              transform:
                - calculate: "datum.erin_low_score === datum.jordan_low_score ? 'Level' : datum.jordan_low_score > datum.erin_low_score ? 'Jordan +' + format(datum.jordan_low_score - datum.erin_low_score, '.0f') : 'Erin +' + format(datum.erin_low_score - datum.jordan_low_score, '.0f')"
                  as: gap_label
              encoding:
                text: { field: gap_label, type: nominal }

  - tab: Top
    height: "188"
    widgets:
      - name: Yahtzees
        type: chart
        chart: vega-lite
        col: 6
        description: Natural 50s plus each bonus Yahtzee.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *num_erin
              encoding:
                text: { field: erin_total_yahtzees, type: quantitative, format: ",.0f" }
            - mark: *num_jordan
              encoding:
                text: { field: jordan_total_yahtzees, type: quantitative, format: ",.0f" }
            - mark: *gap_mark
              transform:
                - calculate: "datum.erin_total_yahtzees === datum.jordan_total_yahtzees ? 'Level' : datum.erin_total_yahtzees > datum.jordan_total_yahtzees ? 'Erin +' + format(datum.erin_total_yahtzees - datum.jordan_total_yahtzees, '.0f') : 'Jordan +' + format(datum.jordan_total_yahtzees - datum.erin_total_yahtzees, '.0f')"
                  as: gap_label
              encoding:
                text: { field: gap_label, type: nominal }

      - name: Solo Yahtzee
        type: chart
        chart: vega-lite
        col: 6
        description: Win rate when only that player scored a Yahtzee. Small type is wins over games.
        query: solo_yahtzee
        spec:
          width: container
          padding: 0
          config: *pair_view
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *num_erin
              encoding:
