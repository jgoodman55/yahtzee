                  title: null
                  sort: [Ones, Twos, Threes, Fours, Fives, Sixes]
                  axis: { labelAngle: 0, labelFontSize: 11, labelLimit: 70 }
                xOffset: { field: player }
                y:
                  field: value
                  type: quantitative
                  title: Average dice
                  scale: { domain: [0, 5] }
                color: *player_color
            - mark:
                type: text
                dy: -8
                fontSize: 10
                fontWeight: 600
              encoding:
                x:
                  field: face
                  type: nominal
                  sort: [Ones, Twos, Threes, Fours, Fives, Sixes]
                xOffset: { field: player }
                y:
                  field: value
                  type: quantitative
                  scale: { domain: [0, 5] }
                  axis: null
                text: { field: value, type: quantitative, format: ".1f" }
                color: { value: "#F3F6FA" }

  - tab: Odds
    height: "420"
    widgets:
      - name: Swing factors
        type: chart
        chart: vega-lite
        col: 12
        description: When only one player had this, how often they won. Grey bars are under 5 games.
        query: strategy_swing
        spec:
          width: container
          height: 280
          autosize: { type: fit, contains: padding, resize: true }
          padding: { top: 4, left: 2, right: 8, bottom: 4 }
          config: *vl_dark
          transform:
            - calculate: "datum.feature === 'Yahtzee bonus > 0' ? 'Yahtzee bonus' : datum.feature === 'Upper bonus (35)' ? 'Upper bonus' : datum.feature === 'Yahtzee = 50' ? 'Yahtzee' : datum.feature === 'Large straight = 40' ? 'Large straight' : datum.feature === 'Large straight = 0' ? 'No large straight' : datum.feature === 'Full house = 0' ? 'No full house' : datum.feature === 'Small straight = 0' ? 'No small straight' : datum.feature"
              as: feature_label
          layer:
            - mark: { type: bar, cornerRadiusEnd: 2 }
              encoding:
                y:
                  field: feature_label
                  type: nominal
                  sort: null
                  title: null
                  axis:
                    labelFontSize: 11
                    labelPadding: 2
                    labelLimit: 140
                x:
                  field: holder_win_rate
                  type: quantitative
                  title: Win rate
                  axis:
                    format: ".0%"
                    values: [0, 0.25, 0.5, 0.75, 1]
                    labelFontSize: 10
                    titleFontSize: 11
                    titlePadding: 2
                  scale: { domain: [0, 1] }
                color:
                  field: tone
                  type: nominal
                  scale:
                    domain: [ok, low_n]
                    range: ["#A78BFA", "#6D7889"]
                  legend: null
                tooltip:
                  - { field: feature, type: nominal, title: Feature }
                  - { field: label, type: nominal, title: Win rate }
                  - { field: n, type: quantitative, title: Games }
            - mark:
                type: text
                align: left
                dx: 4
                fontSize: 10
                fontWeight: 600
                color: "#F3F6FA"
              encoding:
                y:
                  field: feature_label
                  type: nominal
                  sort: null
                x:
                  field: holder_win_rate
                  type: quantitative
                  scale: { domain: [0, 1] }
                text: { field: label }
                color: { value: "#F3F6FA" }

  - tab: Odds
    height: "420"
    widgets:
      - name: Rescue matrix
        type: chart
        chart: vega-lite
        col: 12
        description: Win rate when only one player both missed that box and still scored the other. Faded cells are under 5 games.
        query: strategy_rescue
        spec:
          width: container
          height: 280
          autosize: { type: fit, contains: padding, resize: true }
          padding: { top: 4, left: 2, right: 4, bottom: 2 }
          config: *vl_dark
          transform:
            - calculate: "datum.consolation === 'Has Yahtzee' ? 'Yahtzee' : datum.consolation === 'Has upper bonus' ? 'Upper bonus' : datum.consolation === 'Has both' ? 'Both' : datum.consolation === 'Has neither' ? 'Neither' : datum.consolation"
              as: cons_label
            - calculate: "datum.miss === 'Large straight = 0' ? 'Large straight' : datum.miss === 'Small straight = 0' ? 'Small straight' : datum.miss === 'Full house = 0' ? 'Full house' : datum.miss === 'No Yahtzee' ? 'No Yahtzee' : datum.miss"
              as: miss_label
          encoding:
            x:
              field: cons_label
              type: nominal
              sort: { field: cons_ord }
              title: Still scored
              axis:
                labelAngle: 0
                labelFontSize: 10
                titleFontSize: 11
                labelPadding: 2
                titlePadding: 2
                labelLimit: 72
            y:
              field: miss_label
              type: nominal
              sort: { field: miss_ord }
              title: Missed
              axis:
                labelFontSize: 11
                titleFontSize: 11
                labelPadding: 2
                titlePadding: 4
                labelLimit: 110
          layer:
            - mark: { type: rect, stroke: "#2A3344", strokeWidth: 1 }
              encoding:
                color:
                  condition:
                    - test: "datum.tone === 'empty'"
                      value: "#12171F"
                    - test: "datum.tone === 'low_n'"
                      value: "#3A4454"
                  field: focal_win_rate
                  type: quantitative
                  scale:
                    domain: [0, 1]
                    range: ["#1B2433", "#34D399"]
                  legend: null
                opacity:
                  condition:
                    test: "datum.tone === 'low_n'"
                    value: 0.55
                  value: 1
                tooltip:
                  - { field: miss, type: nominal, title: Missed }
                  - { field: consolation, type: nominal, title: Still scored }
                  - { field: label, type: nominal, title: Win rate }
                  - { field: n, type: quantitative, title: Games }
            - mark:
                type: text
                fontSize: 10
                fontWeight: 600
              encoding:
                text: { field: label }
                color:
                  condition:
                    test: "datum.tone === 'empty' || datum.tone === 'low_n'"
                    value: "#8B95A8"
                  value: "#F3F6FA"

  - tab: Game
    widgets:
      - name: Opening a game
        type: text
        col: 12
        content: |
          Newest games first. The comment is the first column after the game number.

          Tables show the game number. Click a game in the lists to open the
          photo beside the digitized card, or
          [browse every scorecard](/scorecards/index.html).

  - tab: Game
    widgets:
      - name: Commentary
        type: table
        col: 12
        sql: |
          select
            h.game_seq,
            concat_ws(
              ' · ',
              replace(replace(h.margin_comment, 'jordan:', 'Jordan:'), 'erin:', 'Erin:'),
              replace(replace(h.yahtzee_comment, 'jordan:', 'Jordan:'), 'erin:', 'Erin:'),
              replace(replace(h.bonus_comment, 'jordan:', 'Jordan:'), 'erin:', 'Erin:'),
              replace(replace(h.streak_comment, 'jordan:', 'Jordan:'), 'erin:', 'Erin:')
            ) as comment,
            upper(substr(h.winner, 1, 1)) || substr(h.winner, 2) as winner,
            t.erin_recorded_total as erin_score,
            t.jordan_recorded_total as jordan_score
          from mart_head_to_head h
          inner join mart_game_trends t using (game_seq)
          order by h.game_seq desc
        columns:
          - name: game_seq
            label: Game
            frozen: true
          - name: comment
            label: Comment
          - name: winner
            label: Winner
          - name: erin_score
            label: Erin
            number: number
            align: right
          - name: jordan_score
            label: Jordan
            number: number
            align: right

  - tab: Game
    height: "240"
    widgets:
      - name: Closest games
        type: chart
        chart: vega-lite
        col: 6
        description: Click a game to open the scorecard in a new tab.
        query: closest_scorecard_links
        spec:
          width: container
          height: 200
          autosize: { type: fit, contains: padding, resize: true }
          padding: { top: 4, left: 4, right: 8, bottom: 4 }
          config: *vl_dark
          usermeta:
            embedOptions:
              loader:
                target: _blank
          mark:
            type: text
            align: left
            baseline: middle
            fontSize: 12
            fontWeight: 600
            cursor: pointer
            limit: 320
          encoding:
            y:
              field: label
              type: nominal
              sort: null
              title: null
              axis: null
            text: { field: label }
            color:
              field: winner
              type: nominal
              scale:
                domain: [Erin, Jordan, Tie]
                range: ["#FF2D92", "#2D9CFF", "#FFFFFF"]
              legend: null
            href: { field: url, type: nominal }

      - name: Biggest blowouts
        type: chart
        chart: vega-lite
        col: 6
        description: Click a game to open the scorecard in a new tab.
        query: blowout_scorecard_links
        spec:
          width: container
          height: 200
          autosize: { type: fit, contains: padding, resize: true }
          padding: { top: 4, left: 4, right: 8, bottom: 4 }
          config: *vl_dark
          usermeta:
            embedOptions:
              loader:
                target: _blank
          mark:
            type: text
            align: left
            baseline: middle
            fontSize: 12
            fontWeight: 600
            cursor: pointer
            limit: 320
          encoding:
            y:
              field: label
              type: nominal
              sort: null
              title: null
              axis: null
            text: { field: label }
            color:
              field: winner
              type: nominal
              scale:
                domain: [Erin, Jordan, Tie]
                range: ["#FF2D92", "#2D9CFF", "#FFFFFF"]
              legend: null
            href: { field: url, type: nominal }

  - tab: Game
    widgets:
      - name: Sample card
        type: image
        col: 12
        fit: contain
        data:
          columns: [photo_url, alt_text, heading]
          rows:
            - - /scorecards/samples/game_1.png
              - Game 1 original photo beside the seed-rendered scorecard
              - Game 1
        src: photo_url
        alt: alt_text
        title: heading

  - tab: Game
    widgets:
      - name: All games
        type: table
        col: 12
        sql: |
          select
            t.game_seq,
            c.sheet,
            c.game_on_sheet,
            upper(substr(t.winner, 1, 1)) || substr(t.winner, 2) as winner,
            t.margin,
            t.erin_computed_total as erin,
            t.jordan_computed_total as jordan
          from mart_game_trends t
          left join sheet_game_crosswalk c
            on c.game_seq = t.game_seq
          order by t.game_seq desc
        columns:
          - name: game_seq
            label: Game
            frozen: true
          - name: sheet
            label: Sheet
          - name: game_on_sheet
            label: On sheet
          - name: winner
            label: Winner
          - name: margin
            label: Margin
            number: number
            align: right
          - name: erin
            label: Erin
            number: number
            align: right
          - name: jordan
            label: Jordan
            number: number
            align: right

  - tab: Pub
    widgets:
      - name: Map
        type: text
        col: 12
        content: |
          Games with no pub written on the sheet are Unknown.

          [Open the map](/pub_map.html).

  - tab: Pub
    height: "360"
    widgets:
      - name: Win rate
        type: chart
        chart: vega-lite
        col: 12
        description: Share of games won at that pub. The grey line is an even split. Faded bars are under 5 games.
        query: location_win_rates
        spec:
          width: container
          height: 230
          autosize: { type: fit, contains: padding, resize: true }
          padding: { top: 8, left: 4, right: 8, bottom: 8 }
          config: *vl_dark
          layer:
            - mark: { type: bar, cornerRadiusEnd: 2 }
              encoding:
                x:
                  field: location_label
                  type: nominal
                  title: null
                  sort: { field: games, order: descending }
                  axis:
                    labelAngle: -20
                    labelAlign: right
                    labelFontSize: 10
                    labelLimit: 140
                y:
                  field: win_rate
                  type: quantitative
                  title: Win rate
                  axis: { format: ".0%" }
                  scale: { domain: [0, 1] }
                xOffset: { field: player, type: nominal }
                color: *player_color
                opacity:
                  condition:
                    test: "datum.games < 5"
                    value: 0.35
                  value: 1
                tooltip:
                  - { field: location_label, type: nominal, title: Pub }
                  - { field: player, type: nominal, title: Player }
                  - { field: win_rate, type: quantitative, title: Win rate, format: ".0%" }
                  - { field: games, type: quantitative, title: Games }
            - mark:
                type: rule
                color: "#6D7889"
                strokeDash: [4, 3]
                strokeWidth: 1.5
              encoding:
                y: { datum: 0.5 }

  - tab: Pub
    widgets:
      - name: By location
        type: table
        col: 12
        sql: |
          select
            location,
            games,
            erin_wins,
            jordan_wins,
            round(100.0 * erin_wins / games, 1) as erin_win_pct,
            round(100.0 * jordan_wins / games, 1) as jordan_win_pct
          from mart_location_stats
          order by games desc, location
        columns:
          - name: location
            label: Location
          - name: games
            label: Games
            number: number
            align: right
          - name: erin_wins
            label: Erin wins
            number: number
            align: right
          - name: jordan_wins
            label: Jordan wins
            number: number
            align: right
          - name: erin_win_pct
            label: Erin %
            number: number
            align: right
          - name: jordan_win_pct
            label: Jordan %
            number: number
            align: right

  - tab: Pub
    widgets:
      - name: Venues
        type: table
        col: 12
        sql: |
          select
            coalesce(pub_name, merchant_name_raw) as place,
            coalesce(visit_count, 1)::integer as visit_count,
            is_confirmed_pub
          from mart_pub_locations
          order by is_confirmed_pub desc, visit_count desc, place
        columns:
          - name: place
            label: Place
          - name: visit_count
            label: Visits
            number: number
            align: right
          - name: is_confirmed_pub
            label: Confirmed
