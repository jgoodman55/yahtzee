  - tab: Roll
    height: "400"
    widgets:
      - name: Yahtzee matchup
        type: chart
        chart: vega-lite
        col: 12
        description: When only one player scored a Yahtzee, how often they won.
        query: yz_matchup
        spec:
          width: container
          height: 250
          autosize: { type: fit, contains: padding, resize: true }
          padding: { top: 22, left: 2, right: 4, bottom: 2 }
          config: *vl_dark
          transform:
            - calculate: "datum.holder === 'Erin' ? 'Erin alone' : 'Jordan alone'"
              as: holder_short
            - stack: share
              groupby: [holder_short]
              sort:
                - field: outcome_ord
                  order: descending
              as: [share_start, share_end]
            - calculate: "(datum.share_start + datum.share_end) / 2"
              as: share_mid
          layer:
            - mark: { type: bar }
              encoding:
                x:
                  field: holder_short
                  type: nominal
                  sort: { field: holder_ord }
                  title: Who scored it
                  axis:
                    labelAngle: 0
                    labelFontSize: 11
                    titleFontSize: 11
                    labelPadding: 2
                    titlePadding: 2
                    labelLimit: 90
                y:
                  field: share_end
                  type: quantitative
                  title: Share
                  axis: { format: ".0%" }
                  scale: { domain: [0, 1] }
                y2: { field: share_start }
                color:
                  field: stack_key
                  type: nominal
                  scale:
                    domain: [Erin won, Jordan won, Upset]
                    range: ["#FF2D92", "#2D9CFF", "#6D7889"]
                  legend: { title: null, orient: bottom }
                tooltip:
                  - { field: holder_label, type: nominal, title: Holder }
                  - { field: outcome, type: nominal, title: Outcome }
                  - { field: wl_label, type: nominal, title: W/L }
                  - { field: n, type: quantitative, title: Games }
                  - { field: share, type: quantitative, title: Share, format: ".0%" }
                  - { field: label, type: nominal, title: Rate }
            - mark:
                type: text
                fontSize: 11
                fontWeight: 600
                baseline: middle
              encoding:
                x:
                  field: holder_short
                  type: nominal
                  sort: { field: holder_ord }
                y:
                  field: share_mid
                  type: quantitative
                  axis: null
                  scale: { domain: [0, 1] }
                text: { field: wl_label, type: nominal }
                color: { value: "#F3F6FA" }
            - mark:
                type: text
                dy: -12
                fontSize: 12
                fontWeight: 600
              transform:
                - aggregate:
                    - op: min
                      field: label
                      as: holder_label_pct
                    - op: sum
                      field: share
                      as: total
                  groupby: [holder_label, holder_short, holder_ord]
              encoding:
                x:
                  field: holder_short
                  type: nominal
                  sort: { field: holder_ord }
                y:
                  field: total
                  type: quantitative
                  axis: null
                  scale: { domain: [0, 1] }
                text: { field: holder_label_pct, type: nominal }
                color: { value: "#F3F6FA" }

