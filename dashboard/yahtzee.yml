  - tab: Roll
    widgets:
      - name: Every box
        type: table
        col: 12
        sql: |
          select
            display_name as player,
            case category
              when 'ones' then 'Ones'
              when 'twos' then 'Twos'
              when 'threes' then 'Threes'
              when 'fours' then 'Fours'
              when 'fives' then 'Fives'
              when 'sixes' then 'Sixes'
              when 'three_of_a_kind' then 'Three of a kind'
              when 'four_of_a_kind' then 'Four of a kind'
              when 'full_house' then 'Full house'
              when 'small_straight' then 'Small straight'
              when 'large_straight' then 'Large straight'
              when 'chance' then 'Chance'
              when 'yahtzee' then 'Yahtzee'
              else category
            end as category,
            games,
            zero_count,
            miss_rate,
            avg_score
          from mart_category_stats
          order by category_ord, player_key
        columns:
          - name: player
            label: Player
          - name: category
            label: Box
          - name: zero_count
            label: Zeros
            number: number
            align: right
          - name: games
            label: Games
            number: number
            align: right
          - name: miss_rate
            label: Scratch rate
            number: ".0%"
            align: right
          - name: avg_score
            label: Average
            number: number
            align: right

  - tab: Odds
    widgets:
      - name: Reading the rates
        type: text
        col: 12
        content: |
          When exactly one player has a box, how often does that player win?
          These rates are associated with winning. They do not show that the
          box caused the win.

          How often a box is scratched is on the Roll tab. A Yahtzee only
          partly rescues a missed large straight: that rate is the large-straight
          row of the rescue chart, in the Yahtzee and Both columns.

          A dash is no such games, including pairs that cannot happen together
          (no Yahtzee, and also a Yahtzee). Faded cells and grey bars are fewer
          than 5 games.

          How the groups are defined:
          [strategy notes](https://github.com/jgoodman55/yahtzee/blob/main/assets/marts/strategy.md).

  - tab: Odds
    height: "188"
    widgets:
      - name: Upper bonus
        type: chart
        chart: vega-lite
        col: 6
        description: Share of games the upper section reached 63, and how many games that was.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark:
                type: text
                fontSize: 16
                fontWeight: 600
                align: center
                baseline: middle
                x: { expr: "width * 0.28" }
                y: { expr: "height * 0.55" }
                color: "#FF2D92"
                limit: 150
              transform:
                - calculate: "round(datum.erin_upper_bonuses / datum.total_games * 100) + '% (' + format(datum.erin_upper_bonuses, '.0f') + '/' + format(datum.total_games, '.0f') + ')'"
                  as: erin_bonus_label
              encoding:
                text: { field: erin_bonus_label, type: nominal }
            - mark:
                type: text
                fontSize: 16
                fontWeight: 600
                align: center
                baseline: middle
                x: { expr: "width * 0.72" }
                y: { expr: "height * 0.55" }
                color: "#2D9CFF"
                limit: 150
              transform:
                - calculate: "round(datum.jordan_upper_bonuses / datum.total_games * 100) + '% (' + format(datum.jordan_upper_bonuses, '.0f') + '/' + format(datum.total_games, '.0f') + ')'"
                  as: jordan_bonus_label
              encoding:
                text: { field: jordan_bonus_label, type: nominal }

      - name: Upper average
        type: chart
        chart: vega-lite
        col: 6
        description: Average of ones through sixes, before the 35 point bonus.
        query: headline
        spec:
          width: container
          padding: 0
          config: *pair_view
          layer:
            - mark: *name_erin
              encoding:
                text: { value: Erin }
            - mark: *name_jordan
              encoding:
                text: { value: Jordan }
            - mark: *num_erin
              encoding:
                text: { field: erin_avg_upper_pre_bonus, type: quantitative, format: ",.1f" }
            - mark: *num_jordan
              encoding:
                text: { field: jordan_avg_upper_pre_bonus, type: quantitative, format: ",.1f" }
            - mark: *gap_mark
              transform:
                - calculate: "abs(datum.erin_avg_upper_pre_bonus - datum.jordan_avg_upper_pre_bonus) < 0.05 ? 'Level' : datum.jordan_avg_upper_pre_bonus > datum.erin_avg_upper_pre_bonus ? 'Jordan +' + format(datum.jordan_avg_upper_pre_bonus - datum.erin_avg_upper_pre_bonus, '.1f') : 'Erin +' + format(datum.erin_avg_upper_pre_bonus - datum.jordan_avg_upper_pre_bonus, '.1f')"
                  as: gap_label
              encoding:
                text: { field: gap_label, type: nominal }

