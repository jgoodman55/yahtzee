schema: https://getbruin.com/schemas/dac/dashboard/v1
name: Yahtzee Head-to-Head
description: Erin (pink) vs Jordan (blue) — dark analytics. High scores use recorded_total.
connection: local_duckdb

# Colors used on every series: Erin #FF2D92, Jordan #2D9CFF.
# Serve with --template yahtzee-dark (themes/yahtzee-dark.yml).
# KPI definitions live in mart_headline_kpis (see SQL comments there).
#
# DAC metric widgets always paint the figure with --dac-text-primary (no
# value.color). Overview big numbers are Vega-Lite text marks so Erin / Jordan
# / combined totals can use the brand colors. Labels stay the muted widget name.

# Shared mark styles for Overview KPI figures (schema allows x-* extensions).
x-kpi-erin-mark: &erin_mark
  type: text
  fontSize: 32
  fontWeight: 600
  align: left
  baseline: middle
  color: "#FF2D92"

x-kpi-jordan-mark: &jordan_mark
  type: text
  fontSize: 32
  fontWeight: 600
  align: left
  baseline: middle
  color: "#2D9CFF"

x-kpi-neutral-mark: &neutral_mark
  type: text
  fontSize: 32
  fontWeight: 600
  align: left
  baseline: middle
  color: "#FFFFFF"

# Native DAC bar charts have no datalabels field (showValues is heatmap-only).
# Vega-Lite layered bar + text is the same escape hatch Overview uses for
# branded KPI figures.
x-vl-dark: &vl_dark
  background: transparent
  view: { stroke: null }
  axis:
    labelColor: "#A8B3C5"
    titleColor: "#A8B3C5"
    gridColor: "#2A3344"
    domainColor: "#2A3344"
    tickColor: "#2A3344"
  legend:
    labelColor: "#F3F6FA"
    title: null
    orient: bottom

x-player-color: &player_color
  field: player
  type: nominal
  scale:
    domain: ["Erin", "Jordan"]
    range: ["#FF2D92", "#2D9CFF"]
  legend: { title: null, orient: bottom }

x-bar-label: &bar_label
  type: text
  dy: -8
  fontSize: 11
  fontWeight: 600
  color: "#F3F6FA"

queries:
  headline:
    sql: select * from mart_headline_kpis
  races:
    sql: |
      select
        game_seq,
        erin_cum_wins as "Erin",
        jordan_cum_wins as "Jordan"
      from mart_game_trends
      order by game_seq
  cum_yahtzees:
    sql: |
      select
        game_seq,
        erin_cum_yahtzees as "Erin",
        jordan_cum_yahtzees as "Jordan"
      from mart_game_trends
      order by game_seq
  yahtzees_per_game:
    sql: |
      select
        game_seq,
        erin_yahtzees as "Erin",
        jordan_yahtzees as "Jordan"
      from mart_game_trends
      order by game_seq
  multi_yahtzee_cum:
    sql: |
      select
        game_seq,
        erin_cum_multi_yahtzee_games as "Erin",
        jordan_cum_multi_yahtzee_games as "Jordan"
      from mart_game_trends
      order by game_seq
  zeros_per_game:
    sql: |
      select
        game_seq,
        erin_zeros as "Erin",
        jordan_zeros as "Jordan"
      from mart_game_trends
      order by game_seq
  conversion_miss:
    sql: |
      select
        category,
        max(case when player_key = 'erin' then miss_rate end) as "Erin",
        max(case when player_key = 'jordan' then miss_rate end) as "Jordan"
      from mart_category_stats
      where is_conversion_box
      group by category
      order by case category
        when 'full_house' then 1
        when 'small_straight' then 2
        when 'large_straight' then 3
        when 'yahtzee' then 4
      end
  upper_avg_dice:
    sql: |
      select
        category,
        max(case when player_key = 'erin' then avg_dice_count end) as "Erin",
        max(case when player_key = 'jordan' then avg_dice_count end) as "Jordan"
      from mart_category_stats
      where section = 'upper'
      group by category
      order by min(category_ord)
  lower_sum_avg:
    sql: |
      select
        case category
          when 'three_of_a_kind' then '3 of a kind'
          when 'four_of_a_kind' then '4 of a kind'
          else category
        end as category,
        max(case when player_key = 'erin' then avg_score end) as "Erin",
        max(case when player_key = 'jordan' then avg_score end) as "Jordan"
      from mart_category_stats
      where is_sum_box
      group by category
      order by min(category_ord)
  erin_win_margins:
    sql: |
      select margin
      from mart_game_trends
      where winner = 'erin'
  jordan_win_margins:
    sql: |
      select margin
      from mart_game_trends
      where winner = 'jordan'

rows:
  - tab: Overview
    widgets:
      - name: How to read this
        type: text
        col: 12
        content: |
          **Erin** is electric pink (`#FF2D92`). **Jordan** is electric blue (`#2D9CFF`).

          High scores, lifetime points, and averages use **`recorded_total`** — the grand
          total written on the card. Wins and margins use `computed_total` from
          `int_win_loss` (sum of the 15 boxes).

          Yahtzees = `yahtzee = 50` plus `yahtzee_bonus / 100`. A multi-yahtzee
          player-game is `total_yahtzees >= 2` (bonus ≥ 100).

  - tab: Overview
    height: 120
    widgets:
      - name: Total games
        type: chart
        chart: vega-lite
        col: 4
        description: Distinct game_seq in int_win_loss
        query: headline
        spec:
          mark: *neutral_mark
          encoding:
            text: { field: total_games, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Erin wins
        type: chart
        chart: vega-lite
        col: 4
        description: Games Erin won on computed_total
        query: headline
        spec:
          mark: *erin_mark
          encoding:
            text: { field: erin_wins, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Jordan wins
        type: chart
        chart: vega-lite
        col: 4
        description: Games Jordan won on computed_total
        query: headline
        spec:
          mark: *jordan_mark
          encoding:
            text: { field: jordan_wins, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

  - tab: Overview
    height: 120
    widgets:
      - name: Erin high score
        type: chart
        chart: vega-lite
        col: 4
        description: max(recorded_total) for Erin
        query: headline
        spec:
          mark: *erin_mark
          encoding:
            text: { field: erin_high_score, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Jordan high score
        type: chart
        chart: vega-lite
        col: 4
        description: max(recorded_total) for Jordan
        query: headline
        spec:
          mark: *jordan_mark
          encoding:
            text: { field: jordan_high_score, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Total yahtzees
        type: chart
        chart: vega-lite
        col: 4
        description: Natural 50s plus yahtzee_bonus/100, both players
        query: headline
        spec:
          mark: *neutral_mark
          encoding:
            text: { field: total_yahtzees, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

  - tab: Overview
    height: 120
    widgets:
      - name: Erin upper bonuses
        type: chart
        chart: vega-lite
        col: 4
        description: Times Erin scored the 35 upper bonus
        query: headline
        spec:
          mark: *erin_mark
          encoding:
            text: { field: erin_upper_bonuses, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Jordan upper bonuses
        type: chart
        chart: vega-lite
        col: 4
        description: Times Jordan scored the 35 upper bonus
        query: headline
        spec:
          mark: *jordan_mark
          encoding:
            text: { field: jordan_upper_bonuses, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Multi-yahtzee player-games
        type: chart
        chart: vega-lite
        col: 4
        description: Player-games with 2+ yahtzees (yahtzee + bonus ≥ 100)
        query: headline
        spec:
          mark: *neutral_mark
          encoding:
            text: { field: multi_yahtzee_player_games, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

  - tab: Overview
    height: 120
    widgets:
      - name: Erin current streak
        type: chart
        chart: vega-lite
        col: 3
        query: headline
        spec:
          mark: *erin_mark
          encoding:
            text: { field: erin_current_streak, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Jordan current streak
        type: chart
        chart: vega-lite
        col: 3
        query: headline
        spec:
          mark: *jordan_mark
          encoding:
            text: { field: jordan_current_streak, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Erin longest streak
        type: chart
        chart: vega-lite
        col: 3
        query: headline
        spec:
          mark: *erin_mark
          encoding:
            text: { field: erin_longest_streak, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

      - name: Jordan longest streak
        type: chart
        chart: vega-lite
        col: 3
        query: headline
        spec:
          mark: *jordan_mark
          encoding:
            text: { field: jordan_longest_streak, type: quantitative, format: ",.0f" }
          height: 40
          padding: 0

  - tab: Races
    widgets:
      - name: Race notes
        type: text
        col: 12
        content: |
          X-axis is **`game_seq`**, not calendar date. Lines are cumulative so the
          picture stays readable as the seed grows toward ~100 games.

  - tab: Races
    height: 360
    widgets:
      - name: Cumulative wins
        type: chart
        chart: line
        col: 12
        description: Running win counts by game sequence
        query: races
        x: { field: game_seq, type: number, title: Game }
        y: { field: [Erin, Jordan], type: number, title: Wins, beginAtZero: true, curve: straight }
        series:
          Erin: { color: "#FF2D92" }
          Jordan: { color: "#2D9CFF" }

  - tab: Races
    height: 320
    widgets:
      - name: Cumulative yahtzees
        type: chart
        chart: line
        col: 12
        description: Running yahtzee count (50-box + bonus/100)
        query: cum_yahtzees
        x: { field: game_seq, type: number, title: Game }
        y: { field: [Erin, Jordan], type: number, title: Yahtzees, beginAtZero: true, curve: straight }
        series:
          Erin: { color: "#FF2D92" }
          Jordan: { color: "#2D9CFF" }

  - tab: Races
    height: 300
    widgets:
      - name: Yahtzees per game
        type: chart
        chart: bar
        col: 6
        description: Yahtzees scored that game — 2+ is a multi-yahtzee card
        query: yahtzees_per_game
        x: { field: game_seq, type: number, title: Game }
        y: { field: [Erin, Jordan], type: number, title: Yahtzees, beginAtZero: true }
        series:
          Erin: { color: "#FF2D92" }
          Jordan: { color: "#2D9CFF" }

      - name: Cumulative multi-yahtzee games
        type: chart
        chart: line
        col: 6
        description: Running count of player-games with 2+ yahtzees
        query: multi_yahtzee_cum
        x: { field: game_seq, type: number, title: Game }
        y: { field: [Erin, Jordan], type: number, title: Games, beginAtZero: true, curve: straight }
        series:
          Erin: { color: "#FF2D92" }
          Jordan: { color: "#2D9CFF" }

  - tab: Zeros
    widgets:
      - name: Zero rules
        type: text
        col: 12
        content: |
          A **zero** is a scratched scoring box. `upper_bonus` and `yahtzee_bonus`
          are excluded (those are 0/35 and 0/100×n, not category scratches).

          Conversion boxes are the fixed lower-section scores: full house (25),
          small straight (30), large straight (40), yahtzee (50). Miss rate is
          the share of games scored 0.

  - tab: Zeros
    height: 320
    widgets:
      - name: Zeros per game
        type: chart
        chart: line
        col: 12
        description: Count of 0-score categories that game (bonuses excluded)
        query: zeros_per_game
        x: { field: game_seq, type: number, title: Game }
        y: { field: [Erin, Jordan], type: number, title: Zeros, beginAtZero: true, curve: straight }
        series:
          Erin: { color: "#FF2D92" }
          Jordan: { color: "#2D9CFF" }

  - tab: Zeros
    height: 320
    widgets:
      - name: Lower-section miss rate
        type: chart
        chart: vega-lite
        col: 12
        description: Share of games scored 0 on FH / SS / LS / Yahtzee
        query: conversion_miss
        spec:
          height: 220
          padding: { top: 18, left: 8, right: 8, bottom: 8 }
          config: *vl_dark
          transform:
            - fold: ["Erin", "Jordan"]
              as: ["player", "value"]
          encoding:
            x:
              field: category
              type: nominal
              title: Category
              sort:
                - full_house
                - small_straight
                - large_straight
                - yahtzee
              axis: { labelAngle: 0 }
            xOffset: { field: player }
            y:
              field: value
              type: quantitative
              title: Miss rate
              axis: { format: ".0%" }
              scale: { domainMin: 0 }
            color: *player_color
          layer:
            - mark: { type: bar }
            - mark: *bar_label
              encoding:
                text: { field: value, type: quantitative, format: ".0%" }

  - tab: Zeros
    widgets:
      - name: Zeros by category
        type: table
        col: 12
        sql: |
          select
            display_name as player,
            category,
            section,
            games,
            zero_count,
            miss_rate,
            avg_score
          from mart_category_stats
          order by category_ord, player_key
        columns:
          - name: player
            label: Player
          - name: category
            label: Category
          - name: section
            label: Section
          - name: games
            label: Games
            number: number
            align: right
          - name: zero_count
            label: Zeros
            number: number
            align: right
          - name: miss_rate
            label: Miss rate
            number: ".0%"
            align: right
          - name: avg_score
            label: Avg
            number: number
            align: right

  - tab: Deep cuts
    widgets:
      - name: Erin lifetime points
        type: metric
        col: 3
        description: Sum of recorded_total
        query: headline
        value: { field: erin_lifetime_points, type: number, format: ",.0f" }

      - name: Jordan lifetime points
        type: metric
        col: 3
        description: Sum of recorded_total
        query: headline
        value: { field: jordan_lifetime_points, type: number, format: ",.0f" }

      - name: Erin avg / median
        type: metric
        col: 3
        description: Average recorded_total (median is on the player table)
        query: headline
        value: { field: erin_avg_score, type: number, format: ",.1f" }

      - name: Jordan avg / median
        type: metric
        col: 3
        query: headline
        value: { field: jordan_avg_score, type: number, format: ",.1f" }

  - tab: Deep cuts
    widgets:
      - name: Erin bonus rate
        type: metric
        col: 3
        query: headline
        value: { field: erin_bonus_rate, type: number, format: ".0%" }

      - name: Jordan bonus rate
        type: metric
        col: 3
        query: headline
        value: { field: jordan_bonus_rate, type: number, format: ".0%" }

      - name: Erin yahtzees / game
        type: metric
        col: 3
        query: headline
        value: { field: erin_yahtzees_per_game, type: number, format: ".2f" }

      - name: Jordan yahtzees / game
        type: metric
        col: 3
        query: headline
        value: { field: jordan_yahtzees_per_game, type: number, format: ".2f" }

  - tab: Deep cuts
    widgets:
      - name: Erin upper avg (pre-bonus)
        type: metric
        col: 3
        description: Average of ones–sixes only
        query: headline
        value: { field: erin_avg_upper_pre_bonus, type: number, format: ",.1f" }

      - name: Jordan upper avg (pre-bonus)
        type: metric
        col: 3
        query: headline
        value: { field: jordan_avg_upper_pre_bonus, type: number, format: ",.1f" }

      - name: Erin chance avg
        type: metric
        col: 3
        query: headline
        value: { field: erin_avg_chance, type: number, format: ",.1f" }

      - name: Jordan chance avg
        type: metric
        col: 3
        query: headline
        value: { field: jordan_avg_chance, type: number, format: ",.1f" }

  - tab: Deep cuts
    widgets:
      - name: Ties
        type: metric
        col: 4
        query: headline
        value: { field: ties, type: number, format: ",.0f" }

      - name: Erin median
        type: metric
        col: 4
        query: headline
        value: { field: erin_median_score, type: number, format: ",.0f" }

      - name: Jordan median
        type: metric
        col: 4
        query: headline
        value: { field: jordan_median_score, type: number, format: ",.0f" }

  - tab: Deep cuts
    widgets:
      - name: Category average notes
        type: text
        col: 12
        content: |
          **Upper** charts average **dice count** (`score / face`), so ones–sixes
          share a 0–5 scale (18 on sixes = 3 dice). **Lower** charts average
          **points** on the three sum boxes only (3oak / 4oak / chance). Fixed
          conversion boxes (FH / SS / LS / Yahtzee) stay on the Zeros miss-rate
          chart, not here.

          **Win margin** is `abs(computed_total difference)` from the winner's
          perspective. Ties are excluded. Erin and Jordan each get their own
          histogram.

  - tab: Deep cuts
    height: 320
    widgets:
      - name: Upper section — avg dice count
        type: chart
        chart: vega-lite
        col: 6
        description: Average dice per face (score / 1..6). Same 0–5 scale for ones–sixes.
        query: upper_avg_dice
        spec:
          height: 240
          padding: { top: 18, left: 8, right: 8, bottom: 8 }
          config: *vl_dark
          transform:
            - fold: ["Erin", "Jordan"]
              as: ["player", "value"]
          encoding:
            x:
              field: category
              type: nominal
              title: Face
              sort: [ones, twos, threes, fours, fives, sixes]
              axis: { labelAngle: 0 }
            xOffset: { field: player }
            y:
              field: value
              type: quantitative
              title: Avg dice
              scale: { domain: [0, 5] }
            color: *player_color
          layer:
            - mark: { type: bar }
            - mark: *bar_label
              encoding:
                text: { field: value, type: quantitative, format: ".1f" }

      - name: Lower sum boxes — avg points
        type: chart
        chart: vega-lite
        col: 6
        description: Average points on 3oak / 4oak / chance only (typical 0–30).
        query: lower_sum_avg
        spec:
          height: 240
          padding: { top: 18, left: 8, right: 8, bottom: 8 }
          config: *vl_dark
          transform:
            - fold: ["Erin", "Jordan"]
              as: ["player", "value"]
          encoding:
            x:
              field: category
              type: nominal
              title: Category
              sort: ["3 of a kind", "4 of a kind", chance]
              axis: { labelAngle: 0 }
            xOffset: { field: player }
            y:
              field: value
              type: quantitative
              title: Avg points
              scale: { domain: [0, 30] }
            color: *player_color
          layer:
            - mark: { type: bar }
            - mark: *bar_label
              encoding:
                text: { field: value, type: quantitative, format: ".1f" }

  - tab: Deep cuts
    height: 300
    widgets:
      - name: Erin win margins
        type: chart
        chart: vega-lite
        col: 6
        description: Margin on games Erin won (computed_total). Ties excluded.
        query: erin_win_margins
        spec:
          height: 220
          padding: { top: 18, left: 8, right: 8, bottom: 8 }
          config: *vl_dark
          encoding:
            x:
              field: margin
              type: quantitative
              bin: { maxbins: 8 }
              title: Margin
            y:
              aggregate: count
              type: quantitative
              title: Games
              scale: { domainMin: 0 }
          layer:
            - mark: { type: bar, color: "#FF2D92" }
            - mark: *bar_label
              encoding:
                text: { aggregate: count, format: "d" }

      - name: Jordan win margins
        type: chart
        chart: vega-lite
        col: 6
        description: Margin on games Jordan won (computed_total). Ties excluded.
        query: jordan_win_margins
        spec:
          height: 220
          padding: { top: 18, left: 8, right: 8, bottom: 8 }
          config: *vl_dark
          encoding:
            x:
              field: margin
              type: quantitative
              bin: { maxbins: 8 }
              title: Margin
            y:
              aggregate: count
              type: quantitative
              title: Games
              scale: { domainMin: 0 }
          layer:
            - mark: { type: bar, color: "#2D9CFF" }
            - mark: *bar_label
              encoding:
                text: { aggregate: count, format: "d" }

  - tab: Deep cuts
    widgets:
      - name: Closest games
        type: table
        col: 6
        sql: |
          select
            game_seq,
            winner,
            margin,
            erin_computed_total as erin,
            jordan_computed_total as jordan
          from mart_game_trends
          order by margin asc, game_seq
          limit 8
        columns:
          - name: game_seq
            label: Game
          - name: winner
            label: Winner
          - name: margin
            label: Margin
            number: number
            align: right
          - name: erin
            label: Erin
            number: number
            align: right
          - name: jordan
            label: Jordan
            number: number
            align: right

      - name: Biggest blowouts
        type: table
        col: 6
        sql: |
          select
            game_seq,
            winner,
            margin,
            erin_computed_total as erin,
            jordan_computed_total as jordan
          from mart_game_trends
          order by margin desc, game_seq
          limit 8
        columns:
          - name: game_seq
            label: Game
          - name: winner
            label: Winner
          - name: margin
            label: Margin
            number: number
            align: right
          - name: erin
            label: Erin
            number: number
            align: right
          - name: jordan
            label: Jordan
            number: number
            align: right

  - tab: Deep cuts
    widgets:
      - name: Player lifetime
        type: table
        col: 12
        sql: |
          select
            display_name as player,
            games_played,
            wins,
            high_score,
            lifetime_points,
            avg_score,
            median_score,
            total_yahtzees,
            multi_yahtzee_games,
            upper_bonus_hits,
            upper_bonus_rate,
            yahtzees_per_game,
            avg_upper_pre_bonus,
            avg_chance,
            current_win_streak,
            longest_win_streak
          from mart_player_kpis
          order by player_key
        columns:
          - name: player
            label: Player
          - name: games_played
            label: Games
            number: number
            align: right
          - name: wins
            label: Wins
            number: number
            align: right
          - name: high_score
            label: High
            number: number
            align: right
          - name: lifetime_points
            label: Points
            number: number
            align: right
          - name: avg_score
            label: Avg
            number: number
            align: right
          - name: median_score
            label: Median
            number: number
            align: right
          - name: total_yahtzees
            label: Yahtzees
            number: number
            align: right
          - name: multi_yahtzee_games
            label: Multi-Y
            number: number
            align: right
          - name: upper_bonus_hits
            label: Bonuses
            number: number
            align: right
          - name: upper_bonus_rate
            label: Bonus %
            number: ".0%"
            align: right
          - name: yahtzees_per_game
